<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사도토지</title>
<meta name="description" content="고속도로 IC 교통량과 토지·공장 실거래가를 함께 보는 스크리닝 도구">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/*  ⚠️ 이 파일은 프로모션 페이지 자리입니다.
    기존 sado-toji.vercel.app 의 프로모션 페이지 내용으로 통째로 교체하세요.
    유지해야 할 것은 아래 '서비스 바로가기' 링크(/app) 하나뿐입니다.
    프로모션을 없앨 때: 이 파일을 지우고 vercel.json 에 rewrite 를 추가합니다
    (docs/deploy-vercel.md 참고).                                            */
:root{
  --ground:#FBFCFD; --surface:#FFFFFF; --ink:#0F1720; --muted:#5B6875;
  --border:#DEE5EC; --accent:#0F5AA8; --on-accent:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C1116; --surface:#141C25; --ink:#E7EEF4; --muted:#8C9AA8;
    --border:#232E3A; --accent:#56A0E8; --on-accent:#08111A;
  }
}
:root[data-theme="dark"]{
  --ground:#0C1116; --surface:#141C25; --ink:#E7EEF4; --muted:#8C9AA8;
  --border:#232E3A; --accent:#56A0E8; --on-accent:#08111A;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  line-height:1.7; display:grid; place-items:center; padding:2rem 1.25rem;
}
main{max-width:34rem; text-align:center}
h1{font-size:clamp(1.75rem,5vw,2.5rem); line-height:1.2; margin:0 0 .75rem; text-wrap:balance}
p{color:var(--muted); margin:0 0 1.75rem}
.cta{
  display:inline-block; padding:.75rem 1.6rem; border-radius:.45rem;
  background:var(--accent); color:var(--on-accent);
  font-weight:600; text-decoration:none;
}
.cta:hover{filter:brightness(1.08)}
.cta:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
small{display:block; margin-top:2rem; font-size:.78rem; color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>사도토지</h1>
  <p>고속도로 IC 교통량 변화와 인근 토지·공장 실거래가를 함께 보는 스크리닝 도구입니다.</p>
  <a class="cta" href="/app">서비스 바로가기 →</a>
  <small>과거 실거래 신고 자료와 교통량 통계를 요약한 지표입니다.
    미래 가격을 예측하거나 보장하지 않습니다.</small>
</main>
</body>
</html>

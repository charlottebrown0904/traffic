<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마스터 플랜 — 진행률 (비공개)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#FBFCFD; --surface:#FFFFFF; --surface-2:#F2F5F8;
  --ink:#0F1720; --muted:#5B6875; --faint:#8A96A3;
  --border:#DEE5EC; --border-strong:#C4D0DB;
  --accent:#0F5AA8; --accent-soft:#E7F0FA; --on-accent:#FFFFFF;
  --done:#14713F; --done-soft:#E4F3EA;
  --doing:#0F5AA8; --doing-soft:#E7F0FA;
  --blocked:#A32820; --blocked-soft:#FBEAE8;
  --todo:#8A96A3;
  --shadow:0 1px 2px rgba(15,23,32,.05), 0 8px 24px -18px rgba(15,23,32,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1116; --surface:#141C25; --surface-2:#1B242E;
  --ink:#E7EEF4; --muted:#8C9AA8; --faint:#6D7B89;
  --border:#232E3A; --border-strong:#33414F;
  --accent:#56A0E8; --accent-soft:#132538; --on-accent:#08111A;
  --done:#4FC084; --done-soft:#11251B;
  --doing:#56A0E8; --doing-soft:#132538;
  --blocked:#E8796C; --blocked-soft:#2B1614;
  --todo:#6D7B89;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#0C1116; --surface:#141C25; --surface-2:#1B242E;
  --ink:#E7EEF4; --muted:#8C9AA8; --faint:#6D7B89;
  --border:#232E3A; --border-strong:#33414F;
  --accent:#56A0E8; --accent-soft:#132538; --on-accent:#08111A;
  --done:#4FC084; --done-soft:#11251B;
  --doing:#56A0E8; --doing-soft:#132538;
  --blocked:#E8796C; --blocked-soft:#2B1614;
  --todo:#6D7B89;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px; line-height:1.65; word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:56rem; margin:0 auto; padding:2rem 1.25rem 5rem}

.private{
  display:flex; gap:.6rem; align-items:baseline; flex-wrap:wrap;
  background:#9A6206; color:#1A1408; padding:.5rem 1.25rem; font-size:.82rem; font-weight:600;
}
header.top{margin-bottom:1.75rem; padding-bottom:1.5rem; border-bottom:2px solid var(--border-strong)}
h1{margin:0 0 .35rem; font-size:1.7rem; letter-spacing:-.02em}
.sub{margin:0; color:var(--muted); font-size:.9rem}

/* 전체 진행률 */
.overall{
  margin:1.5rem 0 2rem; padding:1.25rem 1.4rem; border-radius:.65rem;
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow);
}
.overall .row{display:flex; align-items:baseline; gap:.75rem; flex-wrap:wrap; margin-bottom:.75rem}
.pct{font-size:2.4rem; font-weight:700; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
.of{color:var(--muted); font-size:.9rem}
.tally{margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap}
.pill{
  font-size:.75rem; font-weight:600; padding:.2rem .6rem; border-radius:999px;
  border:1px solid currentColor; white-space:nowrap;
}
.pill.done{color:var(--done)} .pill.doing{color:var(--doing)}
.pill.blocked{color:var(--blocked)} .pill.todo{color:var(--todo)}

.bar{height:.65rem; border-radius:999px; background:var(--surface-2); overflow:hidden; display:flex}
.bar span{display:block; height:100%}
.bar .b-done{background:var(--done)}
.bar .b-doing{background:var(--doing)}
.bar .b-blocked{background:var(--blocked)}

/* 단계 */
.phase{margin-bottom:1.4rem; border:1px solid var(--border); border-radius:.6rem;
       background:var(--surface); box-shadow:var(--shadow); overflow:hidden}
.phase-head{
  display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
  padding:.85rem 1.1rem; cursor:pointer; background:var(--surface-2);
  border-bottom:1px solid var(--border);
}
.phase-head:hover{background:var(--accent-soft)}
.pid{
  font-family:"IBM Plex Mono",monospace; font-size:.78rem; font-weight:600;
  color:var(--on-accent); background:var(--accent);
  padding:.15rem .5rem; border-radius:.3rem;
}
.pname{font-weight:700; font-size:1rem}
.pgoal{font-size:.82rem; color:var(--muted); width:100%; margin:0}
.pcount{margin-left:auto; font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.pbar{width:5rem; height:.4rem; border-radius:999px; background:var(--border); overflow:hidden; flex:0 0 auto}
.pbar span{display:block; height:100%; background:var(--done)}
.phase.collapsed .tasks{display:none}
.caret{font-size:.7rem; color:var(--faint); transition:transform .15s}
.phase.collapsed .caret{transform:rotate(-90deg)}

.tasks{list-style:none; margin:0; padding:0}
.task{
  display:grid; grid-template-columns:auto 1fr auto; gap:.7rem; align-items:start;
  padding:.6rem 1.1rem; border-bottom:1px solid var(--border);
}
.task:last-child{border-bottom:none}
.task:hover{background:var(--surface-2)}
.task.s-done .t-title{color:var(--muted); text-decoration:line-through}
.dot{
  width:1.1rem; height:1.1rem; border-radius:50%; margin-top:.28rem;
  border:2px solid var(--todo); background:none; cursor:pointer; padding:0; flex:0 0 auto;
}
.task.s-done .dot{background:var(--done); border-color:var(--done)}
.task.s-doing .dot{border-color:var(--doing); background:radial-gradient(var(--doing) 40%, transparent 42%)}
.task.s-blocked .dot{border-color:var(--blocked); background:var(--blocked-soft)}
.dot:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.t-body{min-width:0}
.t-id{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--faint); margin-right:.4rem}
.t-title{font-weight:500}
.t-note{display:block; font-size:.8rem; color:var(--muted); margin-top:.1rem}
.t-meta{display:flex; gap:.35rem; align-items:center; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end}
.owner{
  font-size:.7rem; font-weight:600; padding:.12rem .45rem; border-radius:.25rem;
  background:var(--surface-2); color:var(--muted); white-space:nowrap;
}
.owner.user{background:var(--accent-soft); color:var(--accent)}
.status{font-size:.72rem; font-weight:600; white-space:nowrap}
.s-done .status{color:var(--done)} .s-doing .status{color:var(--doing)}
.s-blocked .status{color:var(--blocked)} .s-todo .status{color:var(--faint)}
.edited{outline:2px solid var(--accent); outline-offset:-2px}

/* 도구 모음 */
.tools{display:flex; gap:.5rem; flex-wrap:wrap; margin:1.25rem 0}
.btn{
  font:inherit; font-size:.85rem; font-weight:600; cursor:pointer;
  padding:.45rem .9rem; border-radius:.4rem;
  background:var(--accent); color:var(--on-accent); border:1px solid var(--accent);
}
.btn.ghost{background:none; color:var(--muted); border-color:var(--border-strong); font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.btn:disabled{opacity:.45; cursor:default; filter:none}
.diff{
  margin:1rem 0; padding:.9rem 1.1rem; border-radius:.5rem;
  background:var(--surface-2); border:1px solid var(--border);
  font-family:"IBM Plex Mono",monospace; font-size:.8rem; white-space:pre-wrap;
}
.hint{font-size:.82rem; color:var(--faint)}
.fatal{padding:3rem 1rem; text-align:center; color:var(--muted)}
@media (max-width:34rem){
  .task{grid-template-columns:auto 1fr; }
  .t-meta{grid-column:2; justify-content:flex-start; margin-top:.2rem}
  .pgoal{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="private">
  <strong>비공개</strong>
  <span>이 페이지는 배포되지 않습니다. <code>internal/</code> 은 <code>public/</code> 밖에 있고 <code>.vercelignore</code> 에도 있습니다.</span>
</div>

<div class="wrap">
<header class="top">
  <h1>마스터 플랜 진행률</h1>
  <p class="sub">상태의 원본은 <code>internal/tasks.json</code>. 여기서 바꾼 것은 <strong>이 브라우저에만</strong> 남습니다.</p>
</header>

<div id="root"></div>
</div>

<script>
'use strict';
const KEY = 'redt.plan.local.v1';
const STATUS = ['todo', 'doing', 'done', 'blocked'];
let DATA = null, LOCAL = {};

const $ = s => document.querySelector(s);
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(LOCAL)); } catch {} };
const statusOf = t => LOCAL[t.id] || t.status;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function counts(tasks) {
  const c = { done: 0, doing: 0, todo: 0, blocked: 0 };
  tasks.forEach(t => c[statusOf(t)]++);
  return c;
}

function render() {
  const all = DATA.phases.flatMap(p => p.tasks);
  const c = counts(all);
  const pct = Math.round(c.done / all.length * 100);
  const L = DATA.legend.status;

  const seg = (k, cls) => c[k] ? `<span class="${cls}" style="width:${c[k] / all.length * 100}%"></span>` : '';

  let html = `
  <div class="overall">
    <div class="row">
      <span class="pct">${pct}%</span>
      <span class="of">${c.done} / ${all.length} 완료</span>
      <span class="tally">
        <span class="pill done">완료 ${c.done}</span>
        <span class="pill doing">진행중 ${c.doing}</span>
        <span class="pill blocked">막힘 ${c.blocked}</span>
        <span class="pill todo">대기 ${c.todo}</span>
      </span>
    </div>
    <div class="bar">${seg('done','b-done')}${seg('doing','b-doing')}${seg('blocked','b-blocked')}</div>
  </div>

  <div class="tools">
    <button class="btn" id="copy">변경사항 복사</button>
    <button class="btn ghost" id="reset">내 변경 초기화</button>
    <button class="btn ghost" id="toggleAll">전부 접기 / 펴기</button>
  </div>
  <div id="diffbox"></div>`;

  DATA.phases.forEach(p => {
    const pc = counts(p.tasks);
    const ppct = Math.round(pc.done / p.tasks.length * 100);
    const collapsed = ppct === 100 ? ' collapsed' : '';
    html += `
    <section class="phase${collapsed}" data-phase="${p.id}">
      <div class="phase-head" role="button" tabindex="0">
        <span class="caret">▼</span>
        <span class="pid">${p.id}</span>
        <span class="pname">${esc(p.name)}</span>
        <span class="pcount">${pc.done}/${p.tasks.length}</span>
        <span class="pbar"><span style="width:${ppct}%"></span></span>
        <p class="pgoal">${esc(p.goal)}</p>
      </div>
      <ul class="tasks">`;
    p.tasks.forEach(t => {
      const s = statusOf(t);
      const changed = LOCAL[t.id] && LOCAL[t.id] !== t.status ? ' edited' : '';
      const own = DATA.legend.owner[t.owner] || t.owner;
      html += `
        <li class="task s-${s}${changed}" data-id="${t.id}">
          <button class="dot" title="상태 변경" aria-label="${esc(t.title)} 상태 변경"></button>
          <div class="t-body">
            <span class="t-id">${t.id}</span><span class="t-title">${esc(t.title)}</span>
            ${t.note ? `<span class="t-note">${esc(t.note)}</span>` : ''}
          </div>
          <div class="t-meta">
            <span class="owner ${t.owner === 'user' ? 'user' : ''}">${own}</span>
            <span class="status">${L[s]}</span>
          </div>
        </li>`;
    });
    html += `</ul></section>`;
  });

  $('#root').innerHTML = html;
  wire();
}

function wire() {
  document.querySelectorAll('.dot').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const li = btn.closest('.task');
      const id = li.dataset.id;
      const task = DATA.phases.flatMap(p => p.tasks).find(t => t.id === id);
      const next = STATUS[(STATUS.indexOf(statusOf(task)) + 1) % STATUS.length];
      if (next === task.status) delete LOCAL[id]; else LOCAL[id] = next;
      save(); render();
    });
  });
  document.querySelectorAll('.phase-head').forEach(h => {
    const toggle = () => h.closest('.phase').classList.toggle('collapsed');
    h.addEventListener('click', toggle);
    h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  });
  $('#reset').addEventListener('click', () => {
    if (Object.keys(LOCAL).length && confirm('브라우저에 저장된 내 변경을 모두 지웁니다.')) {
      LOCAL = {}; save(); render();
    }
  });
  $('#toggleAll').addEventListener('click', () => {
    const any = document.querySelector('.phase:not(.collapsed)');
    document.querySelectorAll('.phase').forEach(p => p.classList.toggle('collapsed', Boolean(any)));
  });
  $('#copy').addEventListener('click', showDiff);
}

function showDiff() {
  const all = DATA.phases.flatMap(p => p.tasks);
  const lines = Object.entries(LOCAL)
    .filter(([id, s]) => { const t = all.find(x => x.id === id); return t && t.status !== s; })
    .map(([id, s]) => {
      const t = all.find(x => x.id === id);
      return `${id}  ${DATA.legend.status[t.status]} → ${DATA.legend.status[s]}   (${t.title})`;
    });
  const box = $('#diffbox');
  if (!lines.length) {
    box.innerHTML = '<p class="hint">원본과 다른 항목이 없습니다.</p>';
    return;
  }
  const text = 'tasks.json 반영 요청\n' + lines.join('\n');
  box.innerHTML = `<div class="diff">${esc(text)}</div>
    <p class="hint">위 내용을 Claude 에게 붙여주시면 <code>tasks.json</code> 에 반영하고 커밋합니다.</p>`;
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
}

fetch('tasks.json')
  .then(r => { if (!r.ok) throw new Error(`tasks.json 을 읽지 못했습니다 (${r.status})`); return r.json(); })
  .then(d => { DATA = d; LOCAL = load(); render(); })
  .catch(err => {
    $('#root').innerHTML = `<div class="fatal"><p><strong>${esc(err.message)}</strong></p>
      <p>파일로 직접 열면(<code>file://</code>) 브라우저가 차단합니다.
         <code>make plan</code> 으로 여세요.</p></div>`;
  });
</script>
</body>
</html>

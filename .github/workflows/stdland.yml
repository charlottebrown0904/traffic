# 표준지공시지가 — 원천 탐침과 적재 (docs/radar-and-current-value.md §4).
#
# 이 컨테이너는 드라이브 큰 파일도, 한국 API 도 못 받는다. 러너는 드라이브를
# 직접 받고(미국이라 구글은 열려 있다), API 는 서울 중계기를 거친다.
#
#   probe   odcloud 15004246 · 브이월드 getReferLandPriceAttr 가 무엇을 주는지
#   drive   드라이브 CSV 를 받아 std_land 에 적재 (파일이 링크 공유여야 한다)
#   odcloud uddi 로 끝까지 넘겨 적재
#   vworld  시군구별 속성 조회로 적재 (ldCode 5자리 · 연도)
#   value-test  현재 가치 2판을 최근 실거래 필지에 대입해 실거래단가와 견준다
#   factor-cells 미래 가치 인자 — 조합 칸 세기 (+ query=estimate 면 추정까지)
#   ecos        한국은행 ECOS 금리·물가·성장률
#               query: (비움)=전부 적재 · probe=받아만 봄 · browse:CODE=표 목록
#                      items:CODE=항목 목록 · find:말=이름으로 표 찾기
#                      findin:CODE,말=그 표의 항목을 이름으로 찾기
#   law-probe   국가법령정보센터 자치법규 API 탐침 (조례 한 건, LAW_OC 필요)
#   law         전국 도시계획조례 → data/ordinance/ 관심 조문 (브랜치에 커밋)
#
# 비공개 감정평가 인자 DB(Supabase)는 SUPABASE_URL · SUPABASE_SERVICE_KEY 로
# 읽는다. 없으면 '평가선례 자료 없음' 으로 돈다 — 값을 지어내지 않는다.
name: 표준지공시지가 (탐침 · 적재)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe / drive / odcloud / vworld / value-test / xy-probe / cadastral / factor-cells / ecos / law-probe / law"
        default: "probe"
      drive_file_id:
        description: "drive 모드 — 드라이브 파일 ID"
        default: "1dwR70x6tsJxu5c7yoUM24ebReksuZjHy"
      uddi:
        description: "odcloud 모드 — uddi:…"
        default: ""
      max_pages:
        description: "odcloud 모드 — 쪽 수 상한 (비우면 전부)"
        default: ""
      sido:
        description: "vworld 모드 — 시도 코드 (쉼표). 전국은 all (비우면 기본값이 들어간다)"
        default: "41"
      years:
        description: "vworld 모드 — 연도 (쉼표). 비우면 전체"
        default: "2025,2026"
      sigungu:
        description: "value-test 모드 — 시군구 코드 5자리"
        default: "41550"
      zone:
        description: "value-test 모드 — 용도지역 조각"
        default: "계획관리"
      n:
        description: "value-test 모드 — 임의로 뽑을 거래 수"
        default: "5"
      months:
        description: "value-test 모드 — 이 달수 안의 거래에서 뽑는다 (거래가 얇은 군은 36~60)"
        default: "12"
      query:
        description: "law 모드 — 조례 검색어 (쉼표로 여럿 · 비우면 도시계획/군계획 조례 묶음)"
        default: ""
      limit:
        description: "law 모드 — 처음 n건만 (시험용 · 비우면 전부) / value-test 모드 — 거리의 저울 (비우면 1.0)"
        default: ""

# law 모드가 data/ordinance 를 브랜치에 커밋한다 (run 31: 없으면 403).
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  stdland:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LAW_OC: ${{ secrets.LAW_OC }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # law 모드가 rebase 로 커밋한다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 이전 수집분 복원
        if: inputs.mode != 'probe'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-stdland-${{ github.run_id }}
          restore-keys: redt-data-

      - name: 탐침
        if: inputs.mode == 'probe'
        run: |
          set -o pipefail
          python -m redt.cli probe-stdland 2>&1 | tee /tmp/stdland.log

      - name: 드라이브 CSV 적재
        if: inputs.mode == 'drive'
        run: |
          set -o pipefail
          # 파일에 기준연도 열이 없다 — years 의 마지막 값(예: 2026)을 쓴다.
          YEARS="${{ inputs.years }}"; YEAR="${YEARS##*,}"
          python -m redt.cli load-stdland --drive "${{ inputs.drive_file_id }}" --year "$YEAR" 2>&1 | tee /tmp/stdland.log

      - name: odcloud 적재
        if: inputs.mode == 'odcloud'
        run: |
          set -o pipefail
          ARGS="--uddi ${{ inputs.uddi }}"
          if [ -n "${{ inputs.max_pages }}" ]; then ARGS="$ARGS --max-pages ${{ inputs.max_pages }}"; fi
          python -m redt.cli load-stdland $ARGS 2>&1 | tee /tmp/stdland.log

      - name: 브이월드 적재
        if: inputs.mode == 'vworld'
        run: |
          set -o pipefail
          python -m redt.cli load-stdland --vworld "${{ inputs.sido }}" --years "${{ inputs.years }}" 2>&1 | tee /tmp/stdland.log

      - name: 현재 가치 검증 (실거래 대입)
        if: inputs.mode == 'value-test'
        run: |
          set -o pipefail
          # 거리의 저울 — 비우면 1.0. 같은 표본에서 값만 바꿔 나란히 돌린다.
          export REDT_DIST_WEIGHT="${{ inputs.limit || '1.0' }}"
          echo "거리 저울 REDT_DIST_WEIGHT=$REDT_DIST_WEIGHT"
          python -m redt.cli value-test --sigungu "${{ inputs.sigungu }}" --zone "${{ inputs.zone }}" \
            --n "${{ inputs.n }}" --months "${{ inputs.months || 12 }}" 2>&1 | tee /tmp/stdland.log

      # 표준지 좌표를 연속지적도에서 묶어 받을 수 있나 (2026-09-13).
      # 좌표가 없어 같은 인근지역에서 표준지를 못 고른다 — 정확도의 가장 큰 구멍.
      - name: 표준지 좌표 묶음 조회 탐침
        if: inputs.mode == 'xy-probe'
        env:
          TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
          SGG: ${{ inputs.sigungu == 'all' && '' || inputs.sigungu }}
        run: |
          set -o pipefail
          python3 scripts/stdland_xy_probe.py 2>&1 | tee /tmp/stdland.log

      # 연속지적도 zip → 필지 좌표. 드라이브 목록(config/cadastral_files.yaml)을
      # 보고 한 장씩 받아 읽고 지운다 — 디스크는 100MB 를 안 넘는다.
      - name: 연속지적도 적재 (필지 좌표)
        if: inputs.mode == 'cadastral'
        run: |
          set -o pipefail
          python -m redt.cli load-cadastral \
            ${{ inputs.query && format('--only {0}', inputs.query) || '' }} 2>&1 | tee /tmp/stdland.log

      # 미래 가치 인자 — 열여섯 조합에 각각 몇 동네가 있는지 먼저 센다.
      # 그 표가 어떤 교차항을 세울 수 있는지 정한다 (docs/future-value.md §2-3).
      - name: 인자 조합 칸 세기
        if: inputs.mode == 'factor-cells'
        run: |
          set -o pipefail
          python -m redt.cli factor-cells \
            --since "${{ inputs.years || '2010' }}" --until "${{ inputs.n || '2025' }}" \
            ${{ inputs.query == 'estimate' && '--estimate' || '' }} 2>&1 | tee /tmp/stdland.log

      # 한국은행 ECOS — 시장 층 (금리·물가·성장률).
      #
      # 인증키는 러너에 없다. ECOS 는 키를 **경로 한 칸**에 넣는 유일한
      # API 라, 자리표 __KEY__ 를 넣어 부르고 중계기가 그 칸을 채운다
      # (api/relay.js 의 pathKey · ECOS_KEY 는 Vercel 에만 있다).
      #
      # query 에 계열 이름을 쉼표로 주면 그것만 받는다. 'probe' 를 주면
      # 받아 보기만 하고 안 쌓는다 — 배선 확인용이다.
      - name: 한국은행 ECOS 수집
        if: inputs.mode == 'ecos'
        env:
          Q: ${{ inputs.query }}
        run: |
          set -o pipefail
          # query 가 넷 중 하나로 갈린다. YAML 식으로 쓰면 읽기 어려워
          # 여기서 가른다 (빈 문자열이 거짓이라 엉뚱한 인자가 들어가던
          # 일을 이미 한 번 겪었다).
          #   (비움)        계열 전부를 받아 쌓는다
          #   probe         받아만 보고 안 쌓는다
          #   browse:CODE   그 코드 아래 표 목록 (top 이면 최상위)
          #   items:CODE    그 표의 항목 목록 — 코드를 여기서 고른다
          #   그 밖          쉼표로 고른 계열만
          case "$Q" in
            probe)    ARGS="--probe" ;;
            browse:*) ARGS="--browse ${Q#browse:}" ;;
            items:*)  ARGS="--browse ${Q#items:} --items" ;;
            find:*)   ARGS="--browse top --find ${Q#find:}" ;;
            findin:*) C="${Q#findin:}"; ARGS="--browse ${C%%,*} --find ${C#*,}" ;;
            "")       ARGS="" ;;
            *)        ARGS="--series $Q" ;;
          esac
          python -m redt.cli ecos --start "${{ inputs.years || '2000' }}" $ARGS \
            2>&1 | tee /tmp/stdland.log

      - name: 자치법규 API 탐침
        if: inputs.mode == 'law-probe'
        run: |
          set -o pipefail
          python -m redt.cli probe-law --query "${{ inputs.query }}" 2>&1 | tee /tmp/stdland.log

      - name: 도시계획조례 적재
        if: inputs.mode == 'law'
        run: |
          set -o pipefail
          python -m redt.cli load-ordinances --query "${{ inputs.query }}" \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} 2>&1 | tee /tmp/stdland.log

      - name: 조례 조문 커밋
        if: inputs.mode == 'law'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ordinance
          if git diff --cached --quiet; then
            echo "바뀐 조문이 없습니다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: 도시계획조례 관심 조문 (run ${{ github.run_number }})"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "$BRANCH" \
              && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - name: 받은 파일은 캐시에 안 남긴다
        if: inputs.mode == 'drive'
        run: rm -f data/processed/stdland.csv

      - name: 수집분 보관
        if: always() && inputs.mode != 'probe' && inputs.mode != 'value-test' && inputs.mode != 'law-probe' && inputs.mode != 'xy-probe' && inputs.mode != 'factor-cells'
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}

      - name: 실행 요약
        if: always()
        run: |
          {
            echo "## 표준지공시지가 — ${{ inputs.mode }}"
            echo
            echo '```'
            cat /tmp/stdland.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 검증 결과 첨부
        if: always() && inputs.mode == 'value-test'
        uses: actions/upload-artifact@v4
        with:
          name: value-test
          path: data/processed/value_test.json
          if-no-files-found: ignore

      - name: 조례 탐침 결과 첨부
        if: always() && inputs.mode == 'law-probe'
        uses: actions/upload-artifact@v4
        with:
          name: law-probe
          path: |
            data/processed/law_probe.json
            data/processed/ordinance/probe-*.json
            data/processed/ordinance/probe-web-*.html
          if-no-files-found: ignore

      - name: 탐침 결과 첨부
        if: always() && inputs.mode == 'probe'
        uses: actions/upload-artifact@v4
        with:
          name: stdland-probe
          path: data/processed/stdland_probe.json
          if-no-files-found: ignore

      # 맨 마지막 단계여야 한다 — 뒤에 오는 단계의 환경변수 덤프가 요약을 밀어낸다.
      # 사람이 읽는 곳은 '실행 요약'(스텝 서머리)이고, 이것은 API 로 꺼내 읽기 위한 것이다.
      - name: 요약 다시 (로그 꼬리에)
        if: always()
        run: |
          echo "───────── 요약 (다시) ─────────"
          # value-test 는 인자 DB 표에 밀려 집계 줄을 놓치므로 집계 구간만 꺼내고,
          # 그 밖의 모드(탐침 등)는 끝부분을 그대로 보인다.
          if [ ! -f /tmp/stdland.log ]; then
            echo "(로그 없음)"
          elif grep -q "실거래 ÷ 산출" /tmp/stdland.log; then
            head -n 3 /tmp/stdland.log
            awk '/실거래 ÷ 산출/,/비공개 인자 DB/' /tmp/stdland.log | head -n 70
          else
            tail -n 30 /tmp/stdland.log
          fi

# 러너(해외)에서 한국 공공 API 에 실제로 닿는지 측정한다.
# 실패 원인이 '차단'인지 '느림'인지 '경로 오류'인지 추측하지 않고 가른다.
name: 망 점검 (한국 공공 API 도달성)

on:
  workflow_dispatch:

jobs:
  netcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 러너 위치
        run: |
          echo "--- 러너 외부 IP·지역 ---"
          curl -sS --max-time 10 https://ipinfo.io/json || echo "(조회 실패)"

      - name: DNS 해석
        run: |
          for h in apis.data.go.kr api.vworld.kr data.ex.co.kr; do
            printf '%-20s ' "$h"
            getent hosts "$h" | head -1 || echo "해석 실패"
          done

      - name: TCP·TLS 연결 시간 측정
        run: |
          for h in apis.data.go.kr api.vworld.kr data.ex.co.kr www.data.go.kr; do
            echo "=== $h ==="
            curl -sS -o /dev/null --max-time 30 \
              -w '  http=%{http_code}  dns=%{time_namelookup}s  connect=%{time_connect}s  tls=%{time_appconnect}s  total=%{time_total}s\n' \
              "https://$h/" || echo "  실패 (exit $?)"
          done

      - name: 실거래가 엔드포인트 (잘못된 키로 — 도달만 확인)
        run: |
          curl -sS --max-time 60 -o /tmp/rtms.txt \
            -w '  http=%{http_code}  total=%{time_total}s\n' \
            'https://apis.data.go.kr/1613000/RTMSDataSvcLandTrade/getRTMSDataSvcLandTrade?serviceKey=PROBE&LAWD_CD=41220&DEAL_YMD=202401&numOfRows=1' \
            || echo "  연결 실패 (exit $?)"
          echo "  --- 응답 앞부분 ---"
          head -c 400 /tmp/rtms.txt 2>/dev/null || true; echo

      - name: 브이월드 지오코더 (잘못된 키로)
        run: |
          curl -sS --max-time 60 -o /tmp/vw.txt \
            -w '  http=%{http_code}  total=%{time_total}s\n' \
            'https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=epsg:4326&type=ROAD&address=%EA%B2%BD%EA%B8%B0%EB%8F%84&key=PROBE' \
            || echo "  연결 실패 (exit $?)"
          echo "  --- 응답 앞부분 ---"
          head -c 400 /tmp/vw.txt 2>/dev/null || true; echo

      - name: 도로공사 엔드포인트 후보 탐색 (404 원인)
        run: |
          for p in \
            "business/curBusinessInfo" \
            "openapi/business/curBusinessInfo" \
            "restinfo/restBusinessInfoList" \
            "trafficapi/trafficIC" \
            "openapi/trafficapi/trafficIC" ; do
            printf '  %-42s ' "$p"
            curl -sS -o /tmp/ex.txt --max-time 25 -w 'http=%{http_code}  ' \
              "https://data.ex.co.kr/$p?key=PROBE&type=json&numOfRows=1&pageNo=1" || true
            head -c 120 /tmp/ex.txt 2>/dev/null | tr '\n' ' '; echo
          done

      - name: 서울 중계기 상태 (토큰 없이 — 배포·환경변수 확인)
        run: |
          URL="${{ secrets.REDT_RELAY_URL }}"
          [ -n "$URL" ] || URL="https://sado-toji.vercel.app"
          echo "대상: $URL/api/relay"
          curl -sS -o /tmp/relay.txt --max-time 30 \
            -w '  http=%{http_code}  total=%{time_total}s\n' "$URL/api/relay" || true
          echo "  --- 응답 ---"
          head -c 300 /tmp/relay.txt 2>/dev/null; echo
          echo
          echo "  판정:"
          if   grep -q '토큰이 일치하지 않습니다' /tmp/relay.txt; then
            echo "    정상 — 함수 배포됨 + RELAY_TOKEN 설정됨"
          elif grep -q 'RELAY_TOKEN 이 설정되지' /tmp/relay.txt; then
            echo "    환경변수 미반영 — 재배포 필요"
          else
            echo "    함수를 찾지 못함 (배포 실패 또는 경로 문제)"
          fi

      - name: 중계기 실호출 (토큰 있으면)
        env:
          RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
        run: |
          if [ -z "$RELAY_TOKEN" ]; then
            echo "  REDT_RELAY_TOKEN 미설정 — 건너뜀 (GitHub Secrets 등록 후 확인)"
            exit 0
          fi
          T='https://apis.data.go.kr/1613000/RTMSDataSvcLandTrade/getRTMSDataSvcLandTrade?LAWD_CD=41220&DEAL_YMD=202401&numOfRows=1'
          curl -sS -o /tmp/via.txt --max-time 60 -G \
            -H "x-relay-token: $RELAY_TOKEN" \
            --data-urlencode "target=$T" \
            -w '  http=%{http_code}  total=%{time_total}s\n' \
            "${RELAY_URL}/api/relay" || true
          echo "  --- 응답 앞부분 ---"
          head -c 500 /tmp/via.txt 2>/dev/null; echo

# 가려진 지번을 면적으로 되찾을 수 있는가 — 탐침.
#
# 국토부 실거래가 API 가 본번 뒷자리를 가려서 준다 (계륵리 1**, 사곡동 산7*).
# 전국 1,179만 건 중 정규식이 통과하는 것 0.1% 뿐이라 PNU 를 못 만든다.
#
# 가려진 것은 본번 뒷자리뿐이고 **면적은 소수점까지 정확하다.** 같은 리(里)
# 안에서 면적이 일치하는 필지는 드물다. 연속지적도를 법정동 단위로 받아
# 면적으로 맞춰 보면 몇 %가 유일하게 특정되는지 나온다.
#
# 요구사항(2026-09-19): "2번은 정확도 목표를 80%로 합니다."
#
# 수집을 건드리지 않는다 — 캐시를 **읽기만** 하고 아무것도 커밋하지 않는다.
name: 지번 탐침 (필지 좌표 믿음 · 가려진 지번 되찾기)

on:
  workflow_dispatch:
    inputs:
      sigungu:
        description: "시군구 코드 (기본 41550 안성시)"
        default: "41550"
      umds:
        description: "시범에 쓸 법정동 수"
        default: "5"
      what:
        description: "무엇을 돌릴지"
        type: choice
        options: [both, trust, blast, jibun, infer, area, order]
        default: both
      trust_sigungu:
        description: "믿음 검증을 한 시군구만 (비우면 전국)"
        default: ""
      fetch:
        description: "추론 전에 필지를 WFS 로 먼저 채울지"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 수집분을 꺼내 읽기만 한다. 저장하지 않으므로 캐시가 늘지 않는다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}
          restore-keys: redt-data-

      # 두 탐침을 한 실행에 담는다. 둘 다 같은 캐시를 읽고, 캐시를 받는
      # 데만 1분 가까이 걸린다 — 따로 돌리면 그 1분을 두 번 쓴다.
      - name: 필지 좌표를 믿어도 되는가
        if: inputs.what == 'both' || inputs.what == 'trust'
        run: |
          set -o pipefail
          python scripts/parcel_trust_probe.py \
            "${{ inputs.trust_sigungu }}" 2>&1 | tee /tmp/trust.log

      - name: 영향 범위 — 라벨을 내리면 무엇이 달라지나
        if: inputs.what == 'both' || inputs.what == 'blast'
        run: |
          set -o pipefail
          python scripts/blast_radius_probe.py 2>&1 | tee /tmp/blast.log

      - name: 가려진 지번 되찾기
        if: inputs.what == 'both' || inputs.what == 'jibun'
        run: |
          set -o pipefail
          python scripts/jibun_match_probe.py \
            "${{ inputs.sigungu || '41550' }}" \
            "${{ inputs.umds || '5' }}" 2>&1 | tee /tmp/jibun.log

      # 추론 엔진. `fetch` 를 켜면 토지특성 WFS(dt_d194)를 시군구 상자만큼
      # 훑어 필지를 채운 뒤 맞춘다 — 표의 구멍이 '유일' 을 거짓으로 만든다.
      - name: 가려진 지번 추론 (안성시 견본)
        if: inputs.what == 'infer'
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
        run: |
          set -o pipefail
          python scripts/jibun_infer.py \
            "${{ inputs.sigungu || '41550' }}" \
            ${{ inputs.fetch && '--fetch' || '' }} \
            --out /tmp/jibun_found.csv \
            --conf /tmp/jibun_conf.json 2>&1 | tee /tmp/infer.log

      # 받아 온 필지도 같이 남긴다. 이 워크플로는 캐시를 **읽기만** 하므로
      # 저장하지 않으면 1,400칸을 다음 실행에서 또 두드린다. 수집용 캐시
      # 접두(redt-data-)에 끼워 넣으면 collect 의 복원이 반쪽짜리를 집을
      # 수 있어, 아티팩트로만 남긴다.
      - name: 붙인 지번·받아 온 필지 내려받기
        if: inputs.what == 'infer'
        uses: actions/upload-artifact@v4
        with:
          name: jibun-found
          path: |
            /tmp/jibun_found.csv
            /tmp/jibun_conf.json
            data/interim/landchar_*.parquet
          retention-days: 7
          if-no-files-found: warn

      # 면적을 브이월드 말고 어디서 받을 수 있나. 호출 몇 번이면 끝난다.
      - name: 면적 원천 탐침
        if: inputs.what == 'area'
        run: |
          set -o pipefail
          python scripts/area_source_probe.py 2>&1 | tee /tmp/area.log

      - name: 돌 순서 — 서울·경기부터
        if: inputs.what == 'order'
        run: |
          set -o pipefail
          python scripts/sigungu_order.py \
            --out /tmp/sigungu_order.json 2>&1 | tee /tmp/order.log

      - name: 순서 파일 내려받기
        if: inputs.what == 'order'
        uses: actions/upload-artifact@v4
        with:
          name: sigungu-order
          path: /tmp/sigungu_order.json
          retention-days: 7
          if-no-files-found: warn

      - name: 실행 요약
        if: always()
        run: |
          for f in trust blast jibun infer area order; do
            [ -f "/tmp/$f.log" ] || continue
            { echo "## $f"; echo; echo '```'
              cat "/tmp/$f.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

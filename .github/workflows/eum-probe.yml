# 토지이음(eum.go.kr) 으로 나가는 링크가 실제로 도는가.
#
# **주소를 지어내지 않는다.** 이 저장소는 기술문서 없이 오퍼레이션 이름을
# 지어냈다가 400 을 받고 그것을 '키 문제' 로 잘못 읽은 적이 있다. 바깥
# 주소는 두드려 보고 쓴다.
#
# 왜 러너에서 직접 안 부르나. 한국 공공 사이트는 해외 IP 를 막는다
# (docs/finding-geoblock.md). 서울 중계기를 거친다.
name: 토지이음 링크 탐침

on:
  workflow_dispatch:
    inputs:
      pnu:
        description: "시험할 필지고유번호(19자리)"
        required: true
        # 광주시 초월읍 지월리 14-1 (실사용 화면 2026-09-10)
        default: "4161025026100140001"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://toji.fyi
      TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
      PNU: ${{ inputs.pnu }}
    steps:
      - name: 후보 주소를 하나씩 두드린다
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::중계기 토큰이 없습니다"; exit 1; fi
          probe () {
            printf '  %-58s ' "$1"
            ENC=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$2")
            code=$(curl -sS -o /tmp/p.html --max-time 40 -w '%{http_code}' \
              -H "x-relay-token: $TOKEN" "$BASE/api/relay?target=$ENC" || echo "000")
            size=$(wc -c < /tmp/p.html 2>/dev/null || echo 0)
            printf 'http=%s %sB ' "$code" "$size"
            # **글자를 본다.** 200 이어도 '조회할 수 없습니다' 면 못 쓰는 주소다.
            if grep -qE '지목|용도지역|토지이용계획' /tmp/p.html 2>/dev/null; then
              echo "✓ 토지 내용 있음"
            elif grep -qE '오류|없습니다|잘못' /tmp/p.html 2>/dev/null; then
              echo "✗ 오류 문구"
            else
              echo "· 판단 보류"
            fi
          }
          echo "PNU=$PNU"
          echo
          echo "── 토지이음 ──"
          probe "첫 화면"            "https://www.eum.go.kr/"
          probe "luLandDet.jsp"      "https://www.eum.go.kr/web/ar/lu/luLandDet.jsp?pnu=$PNU"
          probe "luLandDetR.jsp"     "https://www.eum.go.kr/web/ar/lu/luLandDetR.jsp?pnu=$PNU"
          probe "luLandDet + mode"   "https://www.eum.go.kr/web/ar/lu/luLandDet.jsp?mode=search&pnu=$PNU"
          echo
          echo "── 갈음할 곳 ──"
          probe "씨:리얼"            "https://seereal.lh.or.kr/"
          probe "일사편리"           "https://kras.go.kr/"
          probe "브이월드 지도"      "https://map.vworld.kr/map/ws3dmap.do"
          echo
          echo "판정: '토지 내용 있음' 이 뜬 주소만 화면에 답니다."

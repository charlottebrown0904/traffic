# 프리미엄 파일(격차율 표·표준지 조각)을 Supabase 비공개 버킷 'premium' 에 올린다.
# 평소에는 urban-check 의 export-web 이 스스로 올린다. 이것은 처음 채울 때·
# 손으로 다시 올릴 때 쓴다. 키는 시크릿에서만 온다.
name: 프리미엄 자료 올리기

on:
  workflow_dispatch:
    inputs:
      src:
        description: "올릴 폴더 (비우면 data/processed/premium)"
        default: ""
      upload:
        description: "0 이면 올리지 않고 익명 거부 확인만"
        default: "1"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 올리기
        if: inputs.upload != '0'
        run: |
          set -o pipefail
          python -m redt.cli premium-upload ${{ inputs.src && format('--src {0}', inputs.src) || '' }} 2>&1 | tee /tmp/up.log
      - name: 익명은 못 받는지 확인
        # 시크릿 SUPABASE_URL 에 스킴 없는 값이 들어 있을 수 있어(run 15) 주소는 코드가 푼다.
        run: |
          base=$(python -c "from redt.appraisal_db import base_url; print(base_url())")
          for f in valuation.json stdland-41550.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/storage/v1/object/premium/$f")
            echo "익명 GET $f → HTTP $code (400/401/403 이어야 한다)" | tee -a /tmp/up.log
            case "$code" in 400|401|403) ;; *) echo "::error::익명이 받아 갔거나 주소가 틀렸습니다 ($code)"; exit 1;; esac
          done
      - name: 실행 요약
        if: always()
        run: |
          { echo "## 프리미엄 자료 올리기"; echo; echo '```'; cat /tmp/up.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

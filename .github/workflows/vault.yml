# 받은 자료가 날아가지 않게 지킨다.
#
# 사장님 지시(2026-09-09): "캐쉬는 관리 잘해주세요. 받은 자료들이
# 날아가면 안됩니다."
#
# ## 무엇이 위험한가
#
# 우리가 모은 것은 전부 **Actions 캐시** 한 곳에만 있습니다. 캐시에는
# 죽는 방법이 둘 있습니다.
#
#   (가) **7일 규칙.** 이레 동안 아무도 안 꺼내 쓰면 GitHub 이 지웁니다.
#        수집을 일주일 쉬면 그날로 사라집니다.
#   (나) **10GB 한도.** 넘치면 오래된 것부터 조용히 지워집니다.
#        이쪽은 이미 prune_caches.py 가 셋으로 묶어 두어 6.2GB 입니다.
#
# 위험한 것은 (가)입니다. 그리고 캐시가 사라졌다는 사실은 **다음 수집이
# 처음부터 다시 도는 것**으로만 드러납니다 — 그때는 이미 늦습니다.
#
# ## 이 워크플로가 하는 일
#
#   1. 캐시를 꺼내 본다        → 꺼내 쓴 순간 7일 시계가 0으로 돌아간다
#   2. 없으면 **빨갛게 실패**  → 조용히 사라지지 않게. 이것이 경보다
#   3. 되돌릴 수 없는 것만 릴리스에 올린다 → 릴리스 첨부는 안 지워진다
#
# 되돌릴 수 있는 것은 안 올립니다. panel.parquet·scores.csv 는 원본에서
# 다시 만들면 되고, 그것까지 넣으면 백업이 두 배가 됩니다. 못 되돌리는
# 것은 **할당량이 걸린 것**입니다 — 지오코딩 결과와 수집한 실거래.
name: 자료 지키기 (캐시 수명 · 원본 백업)

on:
  schedule:
    # 사흘에 한 번. 7일 규칙에 이틀 여유를 두고 두 번 돕니다 — 한 번
    # 걸러도 다음 차례가 시계를 되돌립니다. (UTC 19:20 = KST 04:20)
    - cron: "20 19 */3 * *"
  workflow_dispatch:
    inputs:
      backup:
        description: "릴리스에 백업까지 올릴까요"
        type: boolean
        default: true
      restore:
        description: "반대로, 릴리스에서 캐시를 되살립니다 (캐시가 죽었을 때만)"
        type: boolean
        default: false

# 백업이 겹쳐 돌면 릴리스 첨부를 서로 덮어씁니다.
concurrency:
  group: vault
  cancel-in-progress: false

permissions:
  contents: write        # 릴리스 첨부를 올리려면 필요합니다. 그 하나뿐입니다.

env:
  TAG: data-vault        # 백업이 붙는 릴리스. 한 곳으로 고정합니다.

jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ── 되살리기 (캐시가 죽었을 때만) ──
      #
      # 먼저 둡니다. 죽은 캐시를 꺼내려다 실패하고 끝나면 되살릴 기회가
      # 없습니다.
      - name: 릴리스에서 되살리기
        if: inputs.restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vault
          gh release download "$TAG" --dir /tmp/vault --pattern 'vault.tar.zst.*'
          ls -l /tmp/vault | sed 's/^/  /'
          # 나눠 올린 조각을 순서대로 이어 붙입니다.
          cat /tmp/vault/vault.tar.zst.* > /tmp/vault.tar.zst
          mkdir -p data
          tar --zstd -xf /tmp/vault.tar.zst
          echo "되살린 것:"
          find data -type f -printf '  %10s  %p\n' | sort -k2

      - name: 되살린 것을 캐시에 넣기
        if: inputs.restore
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}-mid

      # ── 평소 (사흘마다) ──
      #
      # 꺼내 쓰는 것 자체가 목적입니다. GitHub 은 '마지막으로 꺼내 쓴 날'
      # 을 보고 이레를 셉니다.
      - name: 캐시 꺼내 보기 (7일 시계를 되돌린다)
        if: ${{ !inputs.restore }}
        id: peek
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          # 일부러 안 맞는 열쇠. restore-keys 로 **가장 최근 것**을 꺼냅니다.
          key: redt-data-vault-no-such-key
          restore-keys: redt-data-

      - name: 무엇이 살아 있나
        if: ${{ !inputs.restore }}
        run: |
          set -uo pipefail
          echo "  꺼낸 열쇠: ${{ steps.peek.outputs.cache-matched-key || '(없음)' }}"
          if [ ! -f data/processed/redt.duckdb ]; then
            echo "::error::캐시에 수집분이 없습니다. 7일 규칙으로 지워졌거나"
            echo "::error::한 번도 안 만들어졌습니다."
            echo "::error::릴리스 백업이 있으면 restore=true 로 이 워크플로를"
            echo "::error::다시 돌리세요. 없으면 collect 를 stage=all 로 처음부터."
            exit 1
          fi
          echo "  살아 있는 것:"
          find data -type f -printf '  %10s  %p\n' 2>/dev/null | sort -k2

      # ── 백업 ──
      #
      # 못 되돌리는 것만 담습니다.
      #
      #   geocode_cache.jsonl        브이월드 지오코딩. **하루 할당량이
      #                              걸려 있어 다시 만들려면 며칠이 든다.**
      #   tollgate_*_cache.jsonl     영업소 좌표·권역. 같은 이유.
      #   redt.duckdb                모은 실거래 자체. 다시 받으려면
      #                              data.go.kr 을 몇 시간 두드려야 한다.
      #
      # panel.parquet·trades_priced.parquet·scores.csv·redt.compact.duckdb
      # 는 **안 담습니다.** 위의 것들로 다시 만들면 되고, 담으면 백업이
      # 두 배가 됩니다.
      - name: 백업 만들기
        if: ${{ !inputs.restore && (github.event_name == 'schedule' || inputs.backup) }}
        run: |
          set -euo pipefail
          WANT=""
          for f in data/interim/geocode_cache.jsonl \
                   data/interim/tollgate_poi_cache.jsonl \
                   data/interim/tollgate_region_cache.jsonl \
                   data/processed/redt.duckdb; do
            if [ -f "$f" ]; then WANT="$WANT $f"; else echo "  없음: $f"; fi
          done
          if [ -z "$WANT" ]; then
            echo "::error::담을 것이 하나도 없습니다."; exit 1
          fi
          echo "  담는 것:$WANT"
          # zstd -19 는 2GB 에 십 분씩 걸립니다. -10 이면 몇 분에 끝나고
          # 크기 차이는 몇 %뿐입니다.
          #
          # **--options 는 GNU tar 에 없습니다** (bsdtar 것입니다). 러너의
          # tar 는 GNU 라 그대로 죽었습니다. 압축은 zstd 에 직접 넘깁니다.
          echo "  담기 전 크기:"
          du -ch $WANT | sed 's/^/    /'
          tar -cf - $WANT | zstd -10 -T0 -o /tmp/vault.tar.zst
          ls -l /tmp/vault.tar.zst | sed 's/^/  /'
          # 릴리스 첨부는 한 개 2GB 가 한도입니다. 1.5GB 씩 나눠 올리고
          # 되살릴 때 cat 으로 이어 붙입니다.
          rm -rf /tmp/parts && mkdir -p /tmp/parts
          split -b 1500m -d -a 2 /tmp/vault.tar.zst /tmp/parts/vault.tar.zst.
          ls -l /tmp/parts | sed 's/^/  /'

      - name: 릴리스에 올리기
        if: ${{ !inputs.restore && (github.event_name == 'schedule' || inputs.backup) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "자료 금고" --notes \
              "받은 자료의 백업입니다. .github/workflows/vault.yml 이 올립니다.

            되살리려면 Actions 에서 '자료 지키기' 를 restore=true 로 돌리세요."
          # --clobber 로 같은 이름을 덮어씁니다. 조각 수가 줄었을 때
          # 옛 조각이 남으면 되살릴 때 쓰레기가 붙으므로 먼저 지웁니다.
          for old in $(gh release view "$TAG" --json assets \
                        --jq '.assets[].name' | grep '^vault.tar.zst.' || true); do
            gh release delete-asset "$TAG" "$old" -y || true
          done
          gh release upload "$TAG" /tmp/parts/vault.tar.zst.* --clobber
          echo "  올린 것:"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "  \(.size) \(.name)"'

      - name: 요약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 자료 금고"
            echo
            echo '```'
            find data -type f -printf '%10s  %p\n' 2>/dev/null | sort -k2 || true
            echo '```'
            echo
            gh release view "$TAG" --json assets \
              --jq '.assets[] | "- \(.name) · \(.size) bytes · \(.updatedAt)"' \
              2>/dev/null || echo "- 아직 릴리스가 없습니다."
          } >> "$GITHUB_STEP_SUMMARY"

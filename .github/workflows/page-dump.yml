# 허용 호스트의 페이지 구조를 읽는다 (폼·다운로드 주소 찾기).
name: 페이지 구조 확인

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL (공백 구분)"
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # URL 에 & 가 들어가므로 셸에 직접 펼치면 명령이 끊긴다. 환경변수로 넘긴다.
      - env:
          URLS: ${{ inputs.urls }}
        run: |
          set -- $URLS
          python scripts/page_dump.py "$@"

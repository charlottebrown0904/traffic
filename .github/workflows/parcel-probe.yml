# 필지 조회(WFS)가 왜 400 인가 — 브이월드가 한 말을 그대로 본다.
#
# 2026-09-10 실측: 라이브에서 mode=parcel 이 두 지점 모두 HTTP 400 을
# 냈다. 우리 코드는 본문을 감춘다 — 그 안에 우리가 보낸 요청 URL 이
# 실려 오고 거기에 인증키가 붙어 있어서다. 그 판단은 맞지만, 그래서
# 무엇이 틀렸는지도 같이 감춰졌다.
#
# 중계기로 직접 부른다. api.vworld.kr 는 허용목록에 있고 키는 중계기가
# 붙인다. 러너에서 직접 부르면 해외 IP 라 502 다(docs/finding-geoblock.md).
name: 필지 조회 탐침 (WFS 400)

on:
  workflow_dispatch:
    inputs:
      lat:
        description: "위도"
        default: "37.0080"
      lon:
        description: "경도"
        default: "127.2797"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://toji.fyi
      TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
      LAT: ${{ inputs.lat }}
      LON: ${{ inputs.lon }}
    steps:
      - uses: actions/checkout@v4
      - name: 지금 보내는 꼴과 그 변형들
        run: python3 scripts/parcel_probe.py

# 교통량 API 파라미터 확정.
# 응답 message 가 "무엇이 없다"를 알려주므로, 이름 후보를 넣어보고
# 메시지가 바뀌는지로 정답을 가른다.
name: 도로공사 엔드포인트 탐색

on:
  workflow_dispatch:
    inputs:
      extra:
        description: "추가 파라미터 (예: sumTmUnitTypeCode=1 stdDt=20240101)"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 기준 — 파라미터 없이
        run: python scripts/ex_probe.py odtraffic/trafficAmountByUnit

      - name: 집계시간단위구분코드 이름 후보
        run: |
          for n in sumTmUnitTypeCode sumTmUnitType tmUnitTypeCode timeUnitCode \
                   sumTmUnitCd unitTypeCode aggrTmUnitCode sumTimeUnitCode \
                   tmUnitCode sumTmUnitTpCd timeUnitTypeCode ; do
            echo "  --- $n=1"
            python scripts/ex_probe.py odtraffic/trafficAmountByUnit "$n=1"
          done

      - name: 직접 지정한 조합
        if: inputs.extra != ''
        run: python scripts/ex_probe.py odtraffic/trafficAmountByUnit ${{ inputs.extra }}

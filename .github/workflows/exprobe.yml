# 교통량 API 파라미터 확정.
# 응답 message 가 "무엇이 없다"를 알려주므로, 이름 후보를 하나씩 넣어
# 메시지가 바뀌는지로 정답을 가른다.
name: 도로공사 엔드포인트 탐색

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - name: 교통량 파라미터 이름 찾기
        run: |
          [ -n "$RELAY_TOKEN" ] || { echo "토큰 없음"; exit 1; }

          # $1 = 엔드포인트 뒤 경로, $2.. = 추가 쿼리
          call() {
            local path="$1"; shift
            local q="type=json&numOfRows=2&pageNo=1"
            for kv in "$@"; do q="$q&$kv"; done
            curl -sS -o /tmp/r.json --max-time 30 -G \
              -H "x-relay-token: $RELAY_TOKEN" \
              --data-urlencode "target=https://data.ex.co.kr/openapi/$path?$q" \
              -w '' "${RELAY_URL}/api/relay" || true
            python3 -c "
import json,sys
try:
    d=json.load(open('/tmp/r.json'))
except Exception:
    print('  (JSON 아님)', open('/tmp/r.json',encoding='utf-8',errors='replace').read()[:120]); sys.exit()
msg=d.get('message'); cnt=d.get('count'); lst=d.get('list')
if lst:
    print(f'  ★ 데이터 {cnt}건')
    print('    키:', list(lst[0].keys()))
    print('    첫행:', json.dumps(lst[0], ensure_ascii=False)[:300])
else:
    print(f'  code={d.get(\"code\")}  message={msg}')
"
          }

          echo "=== 기준: 파라미터 없이 ==="
          call odtraffic/trafficAmountByUnit

          echo
          echo "=== 집계시간단위구분코드 이름 후보 ==="
          for n in sumTmUnitTypeCode sumTmUnitType tmUnitTypeCode timeUnitCode \
                   sumTmUnitCd unitTypeCode aggrTmUnitCode sumTimeUnitCode \
                   tmUnitCode sumTmUnitTpCd ; do
            printf '  %-22s' "$n"; echo; call odtraffic/trafficAmountByUnit "$n=1"
          done

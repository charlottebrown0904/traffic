# 필지를 눌러도 정보가 안 나오는 곳이 있다 — 무엇이 없는지 브이월드
# 입으로 듣는다.
#
# 보고(2026-09-10): "계획관리 지역만 클릭이 되는 것 같은데 확인 필요."
# 지금 화면은 dt_d194 한 곳에만 묻는다. 그 표에 없는 필지가 '땅이
# 없다' 로 읽히는지, 연속지적도에는 있는지를 나눠 본다.
#
# 러너에서 브이월드를 직접 부르면 해외 IP 라 502 다. 중계기를 거친다.
name: 필지 칸 탐침 (안 나오는 토지)

on:
  workflow_dispatch:
    inputs:
      address:
        description: "더 볼 주소 (비우면 보고에 나온 두 곳만)"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://toji.fyi
      TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
      EXTRA: ${{ inputs.address }}
    steps:
      - uses: actions/checkout@v4
      - name: 어느 표에 있고 어느 표에 없는가
        run: python3 scripts/parcel_fields_probe.py

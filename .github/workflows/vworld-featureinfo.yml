# 용도지역 '이름' 을 어디서 얻을지 서버에 묻는다.
#
# 화면에 색면은 깔렸는데 그 색이 무슨 뜻인지 알 방법이 없다. 필지를 눌러
# 이름을 띄우려면(GetFeatureInfo) 또는 공식 범례를 쓰려면
# (GetLegendGraphic) **서버가 지원해야** 한다. 레이어 이름을 추측했다가
# 세 겹으로 틀린 적이 있어(api/tile.js 주석) 이번에도 묻고 시작한다.
name: 용도지역 이름 경로 탐침 (GetFeatureInfo · 범례)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      # 러너는 미국이라 한국 공공 API 가 막힌다. 서울 중계기를 거치고,
      # 인증키는 중계기 쪽에만 있다.
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/vworld_featureinfo.py

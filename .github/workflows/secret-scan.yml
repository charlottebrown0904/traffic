# 웹 편집기에서 만든 커밋은 로컬 pre-commit 훅을 거치지 않는다.
# 그 경로로 키가 들어오는 것을 잡는 유일한 그물.
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 추적 중인 파일에 키 값이 있는지 검사
        run: |
          fail=0

          # 1) 값이 채워진 키 변수 (빈 값·자리표시자는 통과)
          if git grep -nIE '^[[:space:]]*(DATA_GO_KR_KEY|VWORLD_KEY|EX_API_KEY|SUPABASE_[A-Z_]*KEY|SERVICE_ROLE[A-Z_]*)=[^[:space:]]+' \
               -- . ':!.github/workflows/secret-scan.yml' ':!.githooks/*' \
             | grep -vEi '=(여기에|your|xxx|<|\$\{|dummy|test|example)'; then
            echo "::error::키 값이 채워진 채로 커밋되어 있습니다. 값을 지우고 config/.env 에 넣으세요."
            fail=1
          fi

          # 2) URL 에 박힌 키
          if git grep -nIE '(serviceKey|apiKey|authKey)=[A-Za-z0-9%+/=_-]{20,}' \
               -- . ':!.github/workflows/secret-scan.yml' ':!.githooks/*'; then
            echo "::error::URL 에 키가 박혀 있습니다."
            fail=1
          fi

          # 3) .env 파일이 추적되고 있는지
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::환경변수 파일이 저장소에 들어 있습니다."
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "키 노출 없음"
          exit $fail

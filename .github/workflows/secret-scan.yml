# 웹 편집기에서 만든 커밋은 로컬 pre-commit 훅을 거치지 않는다.
# 그 경로로 키가 들어오는 것을 잡는 유일한 그물.
#
# **main 과 PR 에서만 돈다** (2026-09-18). 저장소를 private 으로 돌리면
# Actions 분이 세어지는데, 이 검사가 30일에 1,122번 돌아 **1,122분**을
# 먹고 있었다 — 한 번에 하는 일은 13초인데 GitHub 은 작업마다 분 단위로
# 올려 세기 때문이다. 월 한도(2,000분)의 절반이 여기서 나갔다.
#
# 무엇을 잃나 — 잃는 것이 없다. 1,122번 중 648번이 작업 브랜치 푸시였고,
# 그 커밋들은 **이미 로컬 pre-commit 훅을 통과한 것**이다(.githooks/pre-commit
# 이 같은 세 가지를 본다: 키 변수 · URL 에 박힌 키 · 추적되는 .env).
# 훅을 안 거치는 길은 웹 편집기이고 그것은 main 이나 PR 로 들어온다.
# 게다가 어느 브랜치든 배포로 가려면 main 을 지나므로, **검사 없이 배포에
# 닿는 커밋은 없다.**
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 밀면 앞의 실행은 버린다. 브랜치를 올린 뒤 곧바로
# main 을 앞당기는 우리 방식에서 겹치는 실행이 실제로 생긴다.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 추적 중인 파일에 키 값이 있는지 검사
        run: |
          fail=0

          # 1) 값이 채워진 키 변수 (빈 값·자리표시자는 통과)
          if git grep -nIE '^[[:space:]]*(DATA_GO_KR_KEY|VWORLD_KEY|EX_API_KEY|SUPABASE_[A-Z_]*KEY|SERVICE_ROLE[A-Z_]*)=[^[:space:]]+' \
               -- . ':!.github/workflows/secret-scan.yml' ':!.githooks/*' \
             | grep -vEi '=(여기에|your|xxx|<|\$\{|dummy|test|example)'; then
            echo "::error::키 값이 채워진 채로 커밋되어 있습니다. 값을 지우고 config/.env 에 넣으세요."
            fail=1
          fi

          # 2) URL 에 박힌 키
          if git grep -nIE '(serviceKey|apiKey|authKey)=[A-Za-z0-9%+/=_-]{20,}' \
               -- . ':!.github/workflows/secret-scan.yml' ':!.githooks/*'; then
            echo "::error::URL 에 키가 박혀 있습니다."
            fail=1
          fi

          # 3) .env 파일이 추적되고 있는지
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::환경변수 파일이 저장소에 들어 있습니다."
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "키 노출 없음"
          exit $fail

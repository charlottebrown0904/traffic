# 브이월드 '개발' 층이 실제로 그림을 주는지 두드린다 (2026-09-14).
#
# 이름이 목록에 있다고 그림이 오는 것은 아니다 — lt_c_uq111 에서 같은
# 자리에서 세 겹으로 틀린 적이 있다. 빈 그림이 오는 층은 목록에서 뺀다.
# '켰는데 아무것도 안 나온다' 는 화면은 고장으로 읽힌다.
name: 브이월드 개발 층 그림 확인

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "render(기본) / geocode-mask — 가려진 지번 좌표가 진짜인가"
        default: "render"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 개발 층 그림 확인
        if: inputs.probe == 'render' || inputs.probe == ''
        run: python scripts/vworld_render_probe.py 2>&1 | tee /tmp/probe.log

      # 가려진 지번('1**')으로 얻은 'parcel' 좌표가 진짜인가.
      # 이 컨테이너는 중계기를 못 부르므로 러너에서 돈다.
      - name: 가려진 지번 좌표 탐침
        if: inputs.probe == 'geocode-mask'
        env:
          PYTHONPATH: src
          # 지오코더는 **중계기가 아니라 키를 직접** 쓴다
          # (collect/geocode.py 의 geocode_one → keys().require('vworld')).
          # 첫 판이 이것을 안 줘서 죽었다.
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
        run: |
          set -o pipefail
          python scripts/geocode_mask_probe.py 2>&1 | tee /tmp/probe.log

      - name: 요약
        if: always()
        run: |
          { echo "## 탐침 — ${{ inputs.probe || 'render' }}"; echo; echo '```'
            cat /tmp/probe.log 2>/dev/null || echo "(로그 없음)"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

# 브이월드 '개발' 층이 실제로 그림을 주는지 두드린다 (2026-09-14).
#
# 이름이 목록에 있다고 그림이 오는 것은 아니다 — lt_c_uq111 에서 같은
# 자리에서 세 겹으로 틀린 적이 있다. 빈 그림이 오는 층은 목록에서 뺀다.
# '켰는데 아무것도 안 나온다' 는 화면은 고장으로 읽힌다.
name: 브이월드 개발 층 그림 확인

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "render / geocode-mask / roads / roadbuild / roadwork / roadgeom / roadlink / roadkras / parcelshift / parcelpix / roadparcel / roadzone / roadzone2"
        default: "render"

jobs:
  render:
    runs-on: ubuntu-latest
    # **tee 가 실패를 가린다.** 파이프의 끝값이 tee 의 것이라 탐침이 죽어도
    # 단계는 초록으로 끝난다 — 오늘 두 번 그랬다(road.yml 의 exit 128,
    # roadparcel 의 AttributeError 가 '성공 2초' 로 보였다). 한 자리에 건다.
    defaults:
      run:
        shell: bash -eo pipefail {0}
    timeout-minutes: 15
    env:
      RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pillow 가 있어야 **칠해진 화소와 주된 색**을 잴 수 있다. 없으면
      # 탐침이 '?' 만 찍고 지나가 층이 살았는지도 못 가린다 (run 8 이
      # 그랬다). requirements.txt 에는 없다 — 여기서만 쓴다.
      - run: pip install -r requirements.txt pillow
      - name: 개발 층 그림 확인
        if: inputs.probe == 'render' || inputs.probe == ''
        run: python scripts/vworld_render_probe.py 2>&1 | tee /tmp/probe.log

      # 고속도로 공사·신설 계획을 담은 층이 브이월드에 있는가 (2026-09-16 지시).
      # 우리가 그리는 계획도로는 도시계획시설이라 고속국도가 안 들어온다.
      - name: 고속도로 계획층 찾기
        if: inputs.probe == 'roads'
        run: python scripts/road_plan_probe.py 2>&1 | tee /tmp/probe.log

      # 지도층에 계획이 없으므로 **사업 자료**에서 찾는다. 도로공사 포털에
      # '공사현황' 이 있고 거기 시점·종점 **주소**가 있으면, 우리 지오코더로
      # 좌표를 붙여 선으로 그릴 수 있다.
      - name: 고속도로 건설·공사 자료 찾기
        if: inputs.probe == 'roadbuild'
        env:
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
        run: python scripts/road_build_probe.py 2>&1 | tee /tmp/probe.log

      # 명세는 사용자가 확인해 줬다. 이제 **실제로 불러** 주소가 얼마나
      # 깊은지, 지오코딩되는지, 두 점 거리가 공사연장과 맞는지 잰다.
      - name: 고속도로 공사현황 실측
        if: inputs.probe == 'roadwork'
        run: python scripts/road_work_probe.py 2>&1 | tee /tmp/probe.log

      # 직선 대신 **실제 노선 모양**을 어디서 얻나. 배경 지도(OSM)에
      # 이미 그 선이 보이므로, 같은 자리를 OSM 과 도로중심선 양쪽에서
      # 받아 꼭짓점 수까지 재 본다.
      - name: 고속도로 선형 원천 탐침
        if: inputs.probe == 'roadgeom'
        run: python scripts/road_geom_probe.py 2>&1 | tee /tmp/probe.log

      # 3번 길 — 관 자료만으로 선형을 얻을 수 있나. 되면 ODbL 을 안 밟는다.
      # 앞선 탐침이 '고속 없음' 이라고 한 것은 상한에 걸린 탓이었으므로,
      # 상한을 넘기는 법(걸러 받기·쪽 넘기기)까지 함께 시험한다.
      - name: 관 자료 선형 탐침 (교통링크·도로중심선)
        if: inputs.probe == 'roadlink'
        run: python scripts/road_link_probe.py 2>&1 | tee /tmp/probe.log

      # 선형을 선으로 그리는 것 자체가 틀렸다 — 그 구간은 도시계획시설에
      # **면**으로 들어 있다(토지이음이 '대로2류' 로 보여 주는 그 띠).
      # 면이면 필지를 따라가고 누를 수도 있다. 그 면에서 고속도로를
      # 가려낼 칸이 있는지 본다.
      - name: 도시계획시설에서 고속도로 가려내기
        if: inputs.probe == 'roadkras'
        run: python scripts/road_kras_probe.py 2>&1 | tee /tmp/probe.log

      # 필지경계가 지도와 틀어진다(대구). 눈으로는 자료 탓인지 바탕지도
      # 탓인지 안 갈린다 — 같은 주소를 지오코더와 연속지적도에 따로 물어
      # 점이 그 필지 **안에** 있는지 잰다. 대조군도 함께 잰다.
      - name: 필지경계 틀어짐 재기
        if: inputs.probe == 'parcelshift'
        run: python scripts/parcel_shift_probe.py 2>&1 | tee /tmp/probe.log

      # 앞 탐침이 '자료는 안 밀렸다' 를 보였으니, 남은 자리는 **우리가
      # 그리는 자리**다. 같은 지적 층을 브이월드가 칠한 그림(WMS)과 우리가
      # 받아 찍은 선(WFS)으로 각각 받아, 화소를 밀어 가며 겹쳐 본다.
      - name: 필지 선 화소 맞춰 보기
        if: inputs.probe == 'parcelpix'
        run: python scripts/parcel_pix_probe.py 2>&1 | tee /tmp/probe.log

      # 도시계획시설에도 도로구역도에도 고속도로가 없다는 것이 확인됐다.
      # 남은 길은 우리가 가진 선 둘레의 필지를 지적에서 골라내는 것이다.
      # 만들기 전에 지목·거리·개수를 먼저 잰다.
      - name: 고속도로 밑 필지 세어 보기
        if: inputs.probe == 'roadparcel'
        run: python scripts/road_parcel_probe.py 2>&1 | tee /tmp/probe.log

      # 받은 캡처가 '도로구역이 있다' 고 말한다 — 내가 없다고 적은 것이
      # 틀렸거나 다른 문에 있는 것이다. 층 목록을 통째로 다시 보고,
      # PNU 로 지역지구를 묻는 길도 함께 두드린다.
      - name: 도로구역을 어디서 받나
        if: inputs.probe == 'roadzone'
        run: python scripts/road_zone_probe.py 2>&1 | tee /tmp/probe.log

      # B(면)를 확인하고 A(속성)에 쓸 칸 이름을 확보한다. 오류 본문을
      # 자르지 않고 통째로 찍는다 — 지난번에 잘라서 까닭을 못 봤다.
      - name: 도로구역 2차 — 오류 본문과 칸 이름
        if: inputs.probe == 'roadzone2'
        run: python scripts/road_zone2_probe.py 2>&1 | tee /tmp/probe.log

      # 가려진 지번('1**')으로 얻은 'parcel' 좌표가 진짜인가.
      # 이 컨테이너는 중계기를 못 부르므로 러너에서 돈다.
      - name: 가려진 지번 좌표 탐침
        if: inputs.probe == 'geocode-mask'
        env:
          PYTHONPATH: src
          # **이름이 둘 다 어긋나 있었다.**
          #
          # 1) 이 워크플로는 RELAY_URL 을 주는데 redt 라이브러리는
          #    REDT_RELAY_URL 을 읽는다 (config.Relay). 이름이 다르면
          #    중계기가 꺼진 것으로 보고 vworld 를 직접 부른다.
          # 2) geocode_one 이 keys().require('vworld') 로 **먼저 막는다.**
          #    그런데 api.vworld.kr 은 중계기가 열쇠를 갈아 끼우는 곳이라
          #    (api/relay.js 의 VWORLD_KEY) 우리 쪽 값은 쓰이지 않는다.
          #    require 를 통과시킬 자리표만 준다 — 중계기가 지운다
          #    (relay.js 의 STRIP 에 'key' 가 있다).
          REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
          REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
          VWORLD_KEY: relay-replaces-this
        run: |
          set -o pipefail
          python scripts/geocode_mask_probe.py 2>&1 | tee /tmp/probe.log

      - name: 요약
        if: always()
        run: |
          { echo "## 탐침 — ${{ inputs.probe || 'render' }}"; echo; echo '```'
            cat /tmp/probe.log 2>/dev/null || echo "(로그 없음)"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

# 영업소 명단을 메우고 다시 이어 붙인다.
#
# 진단(gaps)에서 교통량 파일의 475개 중 80개가 마스터에 아예 없는 것으로
# 나왔습니다. 도로공사 API 에는 민자고속도로가 없기 때문입니다. 그 80개를
# 이름으로 찾아 좌표를 채우고, 공간 조인을 다시 해서 새 영업소에도 거래가
# 붙게 합니다. 실거래가는 새로 받지 않으므로 API 하루 한도를 거의 쓰지 않습니다.
name: 영업소 보강 (민자 IC 좌표 → 재연결 → 분석)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번에 채울 최대 영업소 수 (비우면 전부)"
        default: ""

# 새로 만든 화면 JSON 을 저장소에 되돌려 넣어야 배포에 반영됩니다.
permissions:
  contents: write

concurrency:
  group: collect          # 수집과 겹치면 같은 캐시를 두고 다투게 됩니다
  cancel-in-progress: false

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-boost-${{ github.run_id }}
          restore-keys: redt-data-

      - name: 복원 확인
        run: |
          if [ ! -f data/processed/redt.duckdb ]; then
            echo "::error::복원된 DB 가 없습니다. 먼저 collect 를 한 번 돌리세요."
            exit 1
          fi
          python -m redt.cli status

      - name: 교통량 적재
        run: python -m redt.cli load-traffic

      - name: 보강 전 진단
        run: python -m redt.cli gaps

      - name: 영업소 보충 (이름으로 좌표 찾기)
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python -m redt.cli fill-tollgates --limit "${{ inputs.limit }}"
          else
            python -m redt.cli fill-tollgates
          fi

      # 새 영업소가 생겼으니 반경 안의 거래를 다시 이어 붙여야 합니다.
      # 이 단계를 빠뜨리면 지도에는 뜨는데 거래가 0 으로 보입니다.
      - name: 거래 ↔ 영업소 재연결
        run: python -m redt.cli link

      - name: 보강 후 진단
        run: python -m redt.cli gaps

      - name: 분석 패널
        run: python -m redt.cli panel

      - name: 밴드별 탄력성
        continue-on-error: true
        run: |
          python -m redt.cli analyze --volume total
          python -m redt.cli analyze --volume freight

      - name: 신규 개통 전후 지가 (이중차분)
        continue-on-error: true
        run: python -m redt.cli events

      - name: IC 교통량 순위 대비 주변 지가
        continue-on-error: true
        run: |
          python -m redt.cli rank --volume total
          python -m redt.cli rank --volume freight

      - name: 스코어 산출
        continue-on-error: true
        run: python -m redt.cli score

      - name: 화면용 JSON 생성
        run: python -m redt.cli export-web

      - name: 수집분 보관
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/data
          if git diff --cached --quiet; then
            echo "바뀐 화면 데이터가 없습니다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: 영업소 보강 후 화면 데이터 갱신 (boost run ${{ github.run_number }})"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          echo "푸시 실패"; exit 1

      # 커밋이 막혀도 결과는 손에 쥘 수 있도록 함께 올려 둡니다.
      - name: 화면용 JSON 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-data-${{ github.run_number }}
          path: public/app/data

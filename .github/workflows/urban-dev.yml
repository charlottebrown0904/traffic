# 전국도시개발사업정보 표준데이터를 받아 저장소에 넣는다.
#
# 가설3 의 '택지지구·도시개발이 들어오면 지가는 오른다' 를 재려면 **지정
# (고시)일**이 있어야 한다. 산업단지 현황 파일에는 그것이 없었다.
#
# 이 데이터셋이 어떤 칸을 주는지는 문서만으로 알 수 없다. 그래서 이 실행은
# 자료 수집이면서 동시에 **탐침**이다 — 받은 칸 이름을 전부 로그에 찍고,
# 지정일로 쓸 칸이 실제로 왔는지 마지막에 한 줄로 말한다.
name: 도시개발사업 받기 (가설3 · 택지지구)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        # 개발계정은 하루 한도가 작다(1,000~10,000). 500건씩 받으므로
        # 60페이지면 3만 건이고 호출은 60번뿐이다. 한도에 닿지 않는다.
        description: "최대 페이지 수 (500건씩)"
        default: "60"

permissions:
  contents: write

concurrency:
  group: urban-dev
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 클론이면 rebase 가 add/add 충돌로 터진다 (collect.yml 참조).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 받기
        run: python -m redt.cli fetch-urban-dev --max-pages "${{ inputs.max_pages }}"

      # 지정일이 있는지 여기서 바로 확인한다. 없으면 이벤트로 못 쓰므로
      # 파일만 받아놓고 몇 주 뒤에 알게 되면 안 된다.
      - name: 적재 시험 (지정일이 실제로 읽히는가)
        continue-on-error: true
        run: python -m redt.cli load-h3

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/raw/zones_housing.csv ]; then
            git add data/raw/zones_housing.csv
          fi
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: 전국도시개발사업정보 받기 (run ${{ github.run_number }})"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "$BRANCH" \
              && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((2 ** i))
          done
          echo "푸시 실패"; exit 1

      # 커밋이 막혀도 받은 것은 손에 쥘 수 있게.
      - name: 파일 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zones-housing-${{ github.run_number }}
          path: data/raw/zones_housing.csv
          if-no-files-found: warn

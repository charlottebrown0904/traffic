# 버튼 하나로 도는 수집 파이프라인.
#
# PC 도 터미널도 없이, GitHub 웹페이지(휴대폰 포함)에서 Run workflow 를 누르면
# 실거래가를 받아 좌표를 붙이고 영업소와 이어서, 화면용 JSON 까지 만들어
# 저장소에 커밋합니다. 커밋되면 Vercel 이 알아서 배포합니다.
name: 수집 (실거래가 → 지오코딩 → 분석 → 화면)

on:
  workflow_dispatch:
    inputs:
      stage:
        # **코드 한 줄 고치려고 3시간을 쓰지 않기 위한 입력입니다.**
        #
        # run 21 의 실제 비용을 보면 어디에 시간이 가는지 분명합니다.
        #
        #   실거래가 수집      0초    ← 다 받았습니다
        #   지오코딩       2시간 58분  ← 브이월드 하루 3만건에 묶여 있습니다
        #   조인               9분
        #   분석 + 화면        3분
        #
        # 화면 색을 고치거나 분석을 다시 돌리는 데 필요한 것은 뒤의 12분
        # 뿐인데, 지금까지는 매번 앞의 3시간을 같이 돌았습니다.
        #
        #   all      수집 → 지오코딩 → 조인 → 분석 → 화면   (하루 한 번)
        #   analyze  조인 → 분석 → 화면                     (약 12분)
        description: "무엇까지 돌릴지"
        type: choice
        options: [all, analyze]
        default: all
      start:
        # 토지·공장 가격은 경제 순환을 탄다. 두세 해만 보면 순환의 한 국면을
        # 효과로 착각한다. 그래서 받을 수 있는 만큼 길게 받는다.
        #
        # **2006-01 이 바닥이다.** 실거래 신고 의무가 그때 시작됐고, 그 이전
        # 거래는 국가가 갖고 있지 않다. 2003년으로 내려도 빈 응답만 온다.
        description: "수집 시작 (YYYY-MM) — 2006-01 이 실거래의 시작점"
        default: "2006-01"
      end:
        # 2026년은 아직 진행 중이라 연 단위 비교에 쓸 수 없다.
        description: "수집 끝 (YYYY-MM)"
        default: "2025-12"
      kind:
        description: "물건 종류 (쉼표구분)"
        default: "land,factory"
      region:
        # 전국으로 방향을 정했으므로(2026-09-02 지시 3) 기본을 nationwide 로
        # 둔다. 휴대폰에서 매번 손으로 고쳐 넣게 하면 언젠가 빠뜨리고,
        # 그러면 표가 비어도 '거래가 없구나' 로 읽힌다.
        description: "권역 (nationwide · pilot_regions.yaml 의 이름 쉼표구분 · all)"
        default: "nationwide"
      workers:
        description: "실거래가 동시 요청 수 (기본 6, 차단당하면 낮추세요)"
        default: "6"
      max_cells:
        # 전국 × 2006~2025 는 셀이 11만 개가 넘는다. 운영계정 하루 한도(10만)를
        # 한 번에 못 넘기므로 나눠 돈다. 남은 셀은 다음 실행이 이어받는다.
        description: "이번 실행에서 처리할 최대 셀 수 (0=제한없음)"
        default: "35000"
      geocode_limit:
        # 4,000 은 근거 없이 박아둔 숫자였다. 브이월드 안내는 하루 3만건이고
        # 초과신청도 받는다. 예전에는 한도에 걸려도 '주소 없음' 과 구별이
        # 안 돼서 진짜 한도를 알 수 없었다.
        #
        # 이제 한도에 걸리면 멈추고 몇 건째였는지 찍는다. 넉넉히 잡아 두면
        # 그 숫자가 곧 측정값이 된다. 남은 것은 캐시를 건드리지 않으므로
        # 다음 실행이 그대로 이어받는다 — 크게 잡아도 잃는 것이 없다.
        description: "이번 실행에서 지오코딩할 최대 건수 (한도에 걸리면 알아서 멈춥니다)"
        default: "30000"

# 결과를 저장소에 다시 커밋해야 하므로 쓰기 권한이 필요합니다.
permissions:
  contents: write
  # 캐시 사용량을 스스로 읽어 찍고, 넘친 만큼 **스스로 지우기** 위해서다.
  # 사장님이 휴대폰으로 일하시므로, 한도에 얼마나 다가갔는지를 찾아다니지
  # 않고 실행 로그에서 바로 보이게 한다.
  actions: write

# 같은 워크플로가 겹쳐 돌면 커밋이 충돌하므로 한 번에 하나만.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    # 한국 공공 API 는 해외 IP 를 막는다 (docs/finding-geoblock.md).
    # 러너는 미국이므로 서울 리전 중계기를 거친다. 인증키는 Vercel 쪽에만 있고
    # 여기에는 중계기 주소와 토큰만 둔다.
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 클론(기본 depth 1)이면 브랜치와 원격의 공통 조상을 모른다.
          # 그 상태로 rebase 하면 git 이 모든 파일을 '양쪽에서 새로 만든 파일'
          # 로 보고 add/add 충돌을 낸다. run 13 이 그렇게 죽었다 — 2시간 33분
          # 수집을 마치고 마지막 커밋 단계에서 40개 파일이 전부 충돌했다.
          # 저장소 이력이 16MB 라 전부 받아도 몇 초다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 받아둔 것을 다음 실행에서 이어받기 위해 DB 와 지오코딩 캐시를 보관합니다.
      # 실행마다 새 키로 저장하고, 복원은 가장 최근 것을 씁니다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}
          restore-keys: redt-data-

      - name: 점검 (키·네트워크)
        run: python -m redt.cli doctor

      # 영업소 엔드포인트가 아직 확정되지 않았다 (P2-3).
      # 여기서 멈추면 실거래가 수집까지 못 하므로 넘어간다. link 도 마찬가지.
      - name: 영업소 마스터
        if: inputs.stage == 'all'
        continue-on-error: true
        run: python -m redt.cli tollgates

      # 교통량을 먼저 싣는다. 어떤 영업소가 마스터에 없는지 알아야 보충할 수
      # 있고, 보충한 뒤에 공간 조인을 해야 새 영업소에도 거래가 붙는다.
      # 순서가 어긋나면 민자 영업소가 지도에는 뜨는데 거래는 0 으로 보인다.
      - name: 교통량 적재 (저장소의 연간 CSV)
        if: inputs.stage == 'all'
        continue-on-error: true
        run: python -m redt.cli load-traffic

      # 영업소 마스터(도로공사 API)에는 민자고속도로가 없다. 교통량 파일과
      # 도로공사 명부에는 있으므로, 이름으로 좌표를 찾아 채운다
      # (docs/tollgate-coverage.md).
      #
      # 명부를 등재하면서 대상이 늘었다. 교통량이 아예 없는 민자 영업소
      # 163곳이 여기서 처음 좌표를 받는다 — 마도(805)가 그중 하나다.
      # 이름 하나에 접미사 다섯 개까지 물으므로 최대 800여 회, 브이월드
      # 하루 한도(3만) 안에서 충분하다.
      - name: 영업소 보충 (민자 등)
        if: inputs.stage == 'all'
        continue-on-error: true
        run: python -m redt.cli fill-tollgates

      # 전국 코드를 아직 안 찾았으면 여기서 한 번 찾는다. 결과가
      # config/sigungu_codes.yaml 에 남아 다음부터는 건너뛴다.
      #
      # '남는다' 가 성립하려면 그 파일을 저장소에 되돌려 놔야 한다. run 13 은
      # 이 단계에 1시간 35분과 호출 19,052회를 쓰고도 커밋 대상이
      # public/app/data 뿐이라 결과를 통째로 잃었다 (캐시 경로에도 config 가
      # 없다). 아래 '결과 커밋' 이 이 파일도 함께 담는다.
      - name: 전국 시군구 코드 확보
        if: inputs.stage == 'all' && contains(inputs.region, 'nationwide')
        run: python -m redt.cli discover-sigungu

      - name: 실거래가 수집
        if: inputs.stage == 'all'
        run: |
          python -m redt.cli trades \
            --kind "${{ inputs.kind }}" \
            --region "${{ inputs.region }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --max-cells "${{ inputs.max_cells }}" \
            --workers "${{ inputs.workers }}"

      # 눈감고 앞에서부터 4,000건씩 붙이면 좌표 없는 329만 건을 다 붙이는 데
      # 822번을 돌려야 한다. **전국에 좌표를 붙일 필요가 없다** — 거리 밴드에
      # 들어갈 수 있는 거래에만 지번 좌표가 필요하다.
      #
      # 그래서 법정동 중심점을 먼저 붙이고(법정동 하나당 한 번, 캐시되므로
      # 거래 건수와 무관하다), 영업소 반경 안에 드는 법정동의 거래만 지번으로
      # 올린다. 근거리 밴드는 지번 좌표만 받으므로(require_parcel_bands)
      # 반경 밖에 쓰는 호출은 밴드에 한 건도 보태지 못한다.
      - name: 지오코딩 (법정동 먼저 → 반경 안만 지번)
        if: inputs.stage == 'all'
        run: |
          python -m redt.cli geocode-staged \
            --limit "${{ inputs.geocode_limit }}"

      # 캐시에서 조인 결과를 뺀다.
      #
      # trade_tollgate_link 는 1,961만 행인데 **매 실행 DELETE 하고 다시
      # 만든다**(cmd_link). 캐시에 실어 봐야 다음 실행이 곧바로 버린다.
      # 그런데 캐시 한 번이 2.36GB 이고 GitHub 한도는 저장소당 10GB 라,
      # 지금은 실행 두 번치밖에 안 남는다. 오래된 것부터 지워지므로
      # 중간 캐시가 밀려나면 지오코딩 3시간이 통째로 날아간다.
      - name: 캐시 앞 정리 (조인 결과는 매번 다시 만든다)
        if: always() && inputs.stage == 'all'
        continue-on-error: true
        run: python -m redt.cli compact-db

      # 여기까지가 비싼 단계다 — 지오코딩이 run 21 에서 2시간 58분 걸렸다.
      # 그 뒤에서 러너가 죽으면 `if: always()` 인 캐시 저장조차 안 돌아서
      # 그 시간이 통째로 사라진다 (run 17). 비싼 것을 손에 넣은 **즉시**
      # 저장한다.
      #
      # 실행당 한 번만 저장한다. 예전에는 여기와 맨 끝에서 두 번 저장해
      # 4.73GB 를 썼는데, 뒤엣것은 앞엣것에 조인 결과와 parquet 몇 개를
      # 더한 것뿐이다. 조인은 위에서 뺐고 parquet 은 3분이면 다시 만든다.
      #
      # 분석만 도는 실행(stage=analyze)은 새로 산 것이 없으므로 저장하지
      # 않는다 — 저장하면 값진 캐시를 밀어내기만 한다.
      - name: 수집분 보관 (지오코딩 직후, 실행당 한 번)
        if: always() && inputs.stage == 'all'
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}-mid

      - name: 거래 ↔ 영업소 공간 조인
        continue-on-error: true
        run: python -m redt.cli link

      - name: 적재 현황
        run: python -m redt.cli status

      # 며칠에 걸쳐 나눠 받으므로, 전체 중 어디까지 왔는지가 매 실행에서
      # 보여야 한다. 안 보이면 몇 번을 더 돌려야 하는지 알 수 없다.
      - name: 수집 진행률
        run: python -m redt.cli progress

      # 여기부터는 실패해도 수집 결과는 지키도록 계속 진행합니다.
      - name: 영업소 누락 진단
        continue-on-error: true
        run: python -m redt.cli gaps

      # 가설3 통제(시군구 인구·산단·택지). 파일이 저장소에 있으면 적재하고,
      # 없으면 이 단계만 빨갛게 되고 나머지는 그대로 간다. 지금까지 이
      # 단계가 파이프라인에 아예 없어서 H3 통제가 늘 비어 있었다.
      - name: 가설3 자료 적재
        continue-on-error: true
        run: python -m redt.cli load-h3

      - name: 분석 패널
        continue-on-error: true
        run: python -m redt.cli panel

      # 계수가 로그에 안 남으면 무엇이 나왔는지 알 수 없습니다.
      - name: 밴드별 탄력성
        continue-on-error: true
        run: |
          python -m redt.cli analyze --volume total
          python -m redt.cli analyze --volume freight

      # 지시2·3 — 개통 전후(인과에 가장 가까운 비교)와 교통량 순위 횡단 비교.
      - name: 신규 개통 전후 지가 (이중차분)
        continue-on-error: true
        run: python -m redt.cli events

      - name: IC 교통량 순위 대비 주변 지가
        continue-on-error: true
        run: |
          python -m redt.cli rank --volume total
          python -m redt.cli rank --volume freight

      # 지시13 — 세 가설을 한 자리에서 판정한다. 계수가 로그에만 남으면
      # 실행이 끝나는 순간 무엇이 나왔는지 아무도 모른다. 이 단계는
      # public/app/data/verdicts.json 으로 남기고(아래 '결과 커밋' 이
      # 가져간다) 실행 요약 칸에도 표를 적는다.
      - name: 세 가설 판정
        continue-on-error: true
        run: python -m redt.cli hypotheses

      - name: 스코어 산출
        continue-on-error: true
        run: python -m redt.cli score

      - name: 화면용 JSON 생성
        continue-on-error: true
        run: python -m redt.cli export-web

      # continue-on-error 가 실패를 가려서, 분석이 통째로 실패했는데도
      # 초록색으로 끝난 적이 있습니다. 결과물이 실제로 나왔는지 봅니다.
      - name: 결과 확인
        run: |
          if [ ! -f data/processed/panel.parquet ]; then
            echo "::error::패널이 만들어지지 않았습니다. 위 '분석 패널' 단계의 로그를 보세요."
            python -m redt.cli status || true
            exit 1
          fi
          echo "패널 생성 확인"

      # 결과를 브랜치에 되돌려 놓는다.
      #
      # **rebase 로 하면 안 된다.** run 24 가 그렇게 실패했다.
      #
      # 실행이 도는 동안 브랜치에 새 커밋이 올라가면, 우리 데이터 커밋을
      # 그 위로 rebase 하게 된다. 그런데 양쪽이 고치는 파일이 똑같다 —
      # public/app/data/*.json 은 매 실행이 통째로 다시 쓴다. 충돌이
      # 안 날 수가 없다.
      #
      # 그리고 충돌하면 그냥 실패로 끝나지 않는다. **작업 트리가 rebase
      # 중간 상태로 남는다.** run 24 에서는 chart.json 이 빈 파일이 됐고,
      # 뒤따르는 라이브 반영 단계가 그것을 잡아냈다("표준 JSON 이
      # 아닙니다"). 안전장치가 없었으면 빈 파일이 프로덕션에 나갔다.
      #
      # 이 파일들은 **생성물**이지 손으로 고치는 것이 아니다. 합칠 이유가
      # 없다. 그래서 합치지 않는다:
      #
      #   1) 방금 만든 것을 옆에 치워 둔다
      #   2) 브랜치 최신으로 깨끗이 맞춘다 (reset --hard)
      #   3) 치워 둔 것을 다시 놓고 커밋한다
      #
      # 충돌이 원천적으로 없다. 경합이 나면(그 사이 또 누가 올리면) 푸시가
      # 거절되므로 처음부터 다시 한다.
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"

          # 되돌려 놓을 것. 시군구 코드는 한 번 찾는 데 1시간 35분·
          # 호출 19,052회가 든다 — 저장소에 남겨야 다음 실행이 건너뛴다.
          KEEP="public/app/data"
          if [ -f config/sigungu_codes.yaml ]; then
            KEEP="$KEEP config/sigungu_codes.yaml"
          fi

          SAVE="$(mktemp -d)"
          for path in $KEEP; do
            mkdir -p "$SAVE/$(dirname "$path")"
            cp -r "$path" "$SAVE/$(dirname "$path")/"
          done

          for i in 1 2 3 4; do
            git fetch origin "$BRANCH"
            # 합치지 않고 브랜치 최신에 맞춘다. 우리가 되돌려 놓을 것은
            # 위에서 이미 치워 뒀다.
            git reset --hard "origin/$BRANCH"
            for path in $KEEP; do
              rm -rf "$path"
              mkdir -p "$(dirname "$path")"
              cp -r "$SAVE/$path" "$(dirname "$path")/"
            done
            git add $KEEP
            if git diff --cached --quiet; then
              echo "바뀐 화면 데이터가 없습니다 — 커밋 생략"
              exit 0
            fi
            git commit -m "data: 수집 run ${{ github.run_number }} 결과 (화면 데이터·시군구 코드)"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            # 그 사이 누가 또 올렸다. 처음부터 다시 — 우리 생성물은
            # $SAVE 에 그대로 있으므로 잃는 것이 없다.
            echo "  푸시가 거절됐습니다. 브랜치를 다시 받아 시도합니다 ($i/4)"
            sleep $((2 ** i))
          done
          echo "푸시 실패"; exit 1

      # 라이브 반영 — main 을 이 브랜치로 fast-forward 합니다.
      #
      # **Vercel 은 main 만 프로덕션으로 배포합니다.** 브랜치에 푸시하면
      # preview URL 만 생기고 sado-toji.vercel.app 은 그대로입니다. 그래서
      # 9월 3~4일 사이 19개 커밋(거래 점 가시성·도로 위계·용도지역 색·
      # 순위 탭 수정·run 21 데이터)이 전부 라이브에 없었습니다. 배포 목록에
      # READY 라고 떠도 target 이 preview 면 사장님 화면은 안 바뀝니다.
      #
      # 사람이 매번 머지하게 두면 언젠가 또 빠집니다. 실행이 스스로 합니다.
      #
      # 규칙 셋 — 이 셋이 없으면 자동화가 사고를 키웁니다.
      #
      #   1) **fast-forward 만.** --force 는 쓰지 않습니다. main 이 갈라져
      #      있으면 밀지 않고 크게 알립니다. 남이 main 에 직접 올린 것을
      #      우리가 지우는 일이 자동으로 일어나서는 안 됩니다.
      #   2) **화면 JSON 이 읽히는지 먼저 봅니다.** 깨진 JSON 이 올라가면
      #      브라우저가 조용히 탭 하나를 꺼버립니다 — traffic.json 이 NaN 을
      #      담아 순위 탭이 꺼져 있던 그 사고입니다. 오류도 안 납니다.
      #   3) main 에서 돌 때는 아무것도 안 합니다.
      #
      # 실패해도 실행을 빨갛게 만들지 않습니다(continue-on-error). 수집
      # 3시간이 성공했는데 배포 한 줄 때문에 '실패' 로 보이면 다음부터
      # 빨간 표시를 안 읽게 됩니다. 대신 요약칸에 크게 적습니다 — 휴대폰에서
      # 실행 페이지를 열면 맨 위에 보입니다.
      - name: 라이브 반영 (main fast-forward)
        if: always() && github.ref_name != 'main'
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in public/app/data/*.json; do
            if ! python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "::error::$f 가 표준 JSON 이 아닙니다 — 라이브에 반영하지 않습니다."
              {
                echo "### ⛔ 라이브 반영 안 함"
                echo "\`$f\` 가 표준 JSON 이 아닙니다. 올라가면 화면 탭이 조용히 꺼집니다."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then
            echo "main 이 이미 같습니다 — 반영할 것 없음"
            exit 0
          fi
          # main 이 우리보다 **앞서** 있는 경우. 실행이 도는 동안 브랜치에
          # 새 커밋이 올라가고 그것이 먼저 main 에 반영되면 이렇게 된다.
          # 갈라진 것이 아니라 이미 지나간 것이므로 조용히 넘어간다 —
          # 여기서 '갈라졌다' 고 알리면 거짓 경보가 되고, 거짓 경보가
          # 몇 번 뜨면 진짜 경보도 안 읽게 된다.
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "main 이 이미 이 커밋을 담고 있습니다 — 반영할 것 없음"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main 이 이 브랜치에서 갈라져 있습니다 — fast-forward 가 아니므로 밀지 않습니다."
            {
              echo "### ⛔ 라이브 반영 안 함"
              echo "main 이 갈라졌습니다. 누가 main 에 직접 올렸는지 확인이 필요합니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin "HEAD:main"
          {
            echo "### ✅ 라이브 반영 완료"
            echo "main 을 \`${{ github.ref_name }}\` 로 올렸습니다."
            echo "잠시 뒤 https://sado-toji.vercel.app/ 에 반영됩니다."
          } >> "$GITHUB_STEP_SUMMARY"

      # 커밋이 막혀도 결과물은 손에 쥘 수 있게 올려 둔다. run 13 은 수집을
      # 다 마치고도 화면 데이터를 받아볼 방법이 없었다.
      - name: 화면용 JSON 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-data-${{ github.run_number }}
          path: public/app/data

      # 용량을 매 실행이 스스로 찍는다.
      #
      # 캐시 한도는 저장소당 10GB 이고, 넘치면 **오래된 것부터 조용히
      # 지워진다.** 지오코딩 3시간이 든 캐시가 그렇게 밀려나면 그 3시간을
      # 다시 써야 하는데, 밀려났다는 사실은 다음 실행이 처음부터 다시
      # 받기 시작할 때에야 드러난다.
      #
      # 찾아가 봐야 아는 숫자는 아무도 안 본다. 여기 찍어 두면 실행
      # 로그를 열 때마다 눈에 들어온다.
      # 오래된 캐시를 지운다.
      #
      # run 23 이 12.35GB / 10GB (124%) 를 찍었다. 넘치면 GitHub 이
      # **오래된 것부터 조용히 지운다** — 그 사실은 다음 실행이 처음부터
      # 다시 받기 시작할 때에야 드러난다. 지오코딩이 든 캐시가 그렇게
      # 밀려나면 몇 시간을 다시 쓴다.
      #
      # 우연에 맡기지 않고 **우리가 고른다.** 최근 것 KEEP 개만 남기고
      # 나머지를 지운다. 방금 저장한 것이 가장 최근이므로 안전하다.
      #
      # 지우기 전에 반드시 확인하는 것 하나: **지금 도는 실행이 만든
      # 캐시는 건드리지 않는다.** 같은 실행의 캐시를 지우면 그 실행이
      # 이어받을 것을 스스로 없애는 셈이다.
      - name: 오래된 캐시 정리 (10GB 한도)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prune_caches.py --keep 3

      - name: 용량 (캐시·실행시간)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              r = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(r, timeout=20))

          GB = 2 ** 30
          LIMIT = 10 * GB          # GitHub 저장소당 Actions 캐시 한도
          u = api("/actions/cache/usage")
          used = u["active_caches_size_in_bytes"]
          n = u["active_caches_count"]
          print("=== Actions 캐시 ===")
          print(f"  {used/GB:.2f} GB / 10 GB  ({used/LIMIT:.0%}) · {n}개")
          if used > LIMIT * 0.8:
              print("  ⚠ 80% 를 넘었습니다. 넘치면 오래된 것부터 지워지고,")
              print("    지오코딩이 든 캐시가 밀려나면 그 시간을 다시 씁니다.")
              print("    → github.com/%s/actions/caches 에서 오래된 것을 지우세요" % repo)

          caches = api("/actions/caches?per_page=20")["actions_caches"]
          if caches:
              print("  큰 것부터")
              for c in sorted(caches, key=lambda x: -x["size_in_bytes"])[:6]:
                  print(f"    {c['size_in_bytes']/GB:5.2f} GB  {c['key']}"
                        f"  (마지막 사용 {c['last_accessed_at'][:10]})")

          # ── 이번 달 실행 시간 ──
          #
          # 청구 화면(settings/billing)은 **한도를 넘긴 뒤에야** 숫자가
          # 보입니다. 포함된 분 안에서 쓰는 동안은 비어 보여서, 얼마나
          # 다가갔는지 알 수가 없습니다. 사장님이 "못 찾겠다" 고 하신
          # 것이 그래서입니다.
          #
          # 그래서 실행 기록에서 직접 셉니다. GITHUB_TOKEN 으로 읽히고
          # 새 비밀값이 필요 없습니다. 청구액이 아니라 **실행 시간**
          # 이므로 GitHub 이 청구한 값과 완전히 같지는 않지만, 한도에
          # 얼마나 다가갔는지 보는 데는 이것이면 충분합니다.
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          month = now.strftime("%Y-%m")
          total, counted, page = 0.0, 0, 1
          while page <= 4:
              runs = api(f"/actions/runs?per_page=100&page={page}")["workflow_runs"]
              if not runs:
                  break
              stop = False
              for r in runs:
                  st, en = r.get("run_started_at"), r.get("updated_at")
                  if not (st and en):
                      continue
                  if st[:7] < month:          # 지난달로 넘어갔다
                      stop = True
                      continue
                  if st[:7] > month:
                      continue
                  a = datetime.strptime(st, "%Y-%m-%dT%H:%M:%SZ")
                  b = datetime.strptime(en, "%Y-%m-%dT%H:%M:%SZ")
                  total += (b - a).total_seconds() / 60
                  counted += 1
              if stop:
                  break
              page += 1

          print()
          print(f"=== 이번 달({month}) 실행 시간 ===")
          print(f"  {total:,.0f}분 · 실행 {counted}건")
          for plan, cap in (("Free", 2000), ("Pro", 3000)):
              mark = " ⚠" if total > cap * 0.8 else ""
              print(f"    {plan} 한도 {cap:,}분 대비 {total/cap:5.0%}{mark}")
          print("  * 실행 시간을 직접 센 값입니다. 청구 기준은")
          print("    github.com/settings/billing (Settings → Access → Billing and licensing)")
          PY
          echo

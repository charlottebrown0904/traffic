# 버튼 하나로 도는 수집 파이프라인.
#
# PC 도 터미널도 없이, GitHub 웹페이지(휴대폰 포함)에서 Run workflow 를 누르면
# 실거래가를 받아 좌표를 붙이고 영업소와 이어서, 화면용 JSON 까지 만들어
# 저장소에 커밋합니다. 커밋되면 Vercel 이 알아서 배포합니다.
name: 수집 (실거래가 → 지오코딩 → 분석 → 화면)

on:
  workflow_dispatch:
    inputs:
      start:
        # 교통량이 2021~2025 이고 1년 시차로 보므로 짝이 되는 거래는 2022~2025 다.
        # 헤도닉 지수의 기준선을 잡을 여유로 한 해 앞부터 받는다.
        description: "수집 시작 (YYYY-MM)"
        default: "2021-01"
      end:
        # 2026년은 아직 진행 중이라 연 단위 비교에 쓸 수 없다.
        description: "수집 끝 (YYYY-MM)"
        default: "2025-12"
      kind:
        description: "물건 종류 (쉼표구분)"
        default: "land,factory"
      region:
        description: "권역 (pilot_regions.yaml 의 이름, 또는 all)"
        default: "gyeonggi_south"
      geocode_limit:
        description: "이번 실행에서 지오코딩할 최대 건수 (일일 한도 대비)"
        default: "4000"

# 결과를 저장소에 다시 커밋해야 하므로 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 같은 워크플로가 겹쳐 돌면 커밋이 충돌하므로 한 번에 하나만.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    # 한국 공공 API 는 해외 IP 를 막는다 (docs/finding-geoblock.md).
    # 러너는 미국이므로 서울 리전 중계기를 거친다. 인증키는 Vercel 쪽에만 있고
    # 여기에는 중계기 주소와 토큰만 둔다.
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 받아둔 것을 다음 실행에서 이어받기 위해 DB 와 지오코딩 캐시를 보관합니다.
      # 실행마다 새 키로 저장하고, 복원은 가장 최근 것을 씁니다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}
          restore-keys: redt-data-

      - name: 점검 (키·네트워크)
        run: python -m redt.cli doctor

      # 영업소 엔드포인트가 아직 확정되지 않았다 (P2-3).
      # 여기서 멈추면 실거래가 수집까지 못 하므로 넘어간다. link 도 마찬가지.
      - name: 영업소 마스터
        continue-on-error: true
        run: python -m redt.cli tollgates

      - name: 실거래가 수집
        run: |
          python -m redt.cli trades \
            --kind "${{ inputs.kind }}" \
            --region "${{ inputs.region }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}"

      - name: 지오코딩 (지번 → 좌표)
        run: python -m redt.cli geocode --limit "${{ inputs.geocode_limit }}"

      - name: 거래 ↔ 영업소 공간 조인
        continue-on-error: true
        run: python -m redt.cli link

      - name: 적재 현황
        run: python -m redt.cli status

      # 여기부터는 실패해도 수집 결과는 지키도록 계속 진행합니다.
      # 포털에서 받아 저장소에 넣어둔 연간 교통량을 DB 에 싣습니다.
      # 이 단계가 없어서 traffic 테이블이 빈 채로 패널이 만들어지지
      # 않은 적이 있습니다 (run 6).
      - name: 교통량 적재 (저장소의 연간 CSV)
        continue-on-error: true
        run: python -m redt.cli load-traffic

      - name: 분석 패널
        continue-on-error: true
        run: python -m redt.cli panel

      # 계수가 로그에 안 남으면 무엇이 나왔는지 알 수 없습니다.
      - name: 밴드별 탄력성
        continue-on-error: true
        run: |
          python -m redt.cli analyze --volume total
          python -m redt.cli analyze --volume freight

      - name: 스코어 산출
        continue-on-error: true
        run: python -m redt.cli score

      - name: 화면용 JSON 생성
        continue-on-error: true
        run: python -m redt.cli export-web

      # continue-on-error 가 실패를 가려서, 분석이 통째로 실패했는데도
      # 초록색으로 끝난 적이 있습니다. 결과물이 실제로 나왔는지 봅니다.
      - name: 결과 확인
        run: |
          if [ ! -f data/processed/panel.parquet ]; then
            echo "::error::패널이 만들어지지 않았습니다. 위 '분석 패널' 단계의 로그를 보세요."
            python -m redt.cli status || true
            exit 1
          fi
          echo "패널 생성 확인"

      - name: 수집분 보관
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/data
          if git diff --cached --quiet; then
            echo "바뀐 화면 데이터가 없습니다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: refresh web export from collect run ${{ github.run_number }}"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          echo "푸시 실패"; exit 1

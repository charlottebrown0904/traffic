# 버튼 하나로 도는 수집 파이프라인.
#
# PC 도 터미널도 없이, GitHub 웹페이지(휴대폰 포함)에서 Run workflow 를 누르면
# 실거래가를 받아 좌표를 붙이고 영업소와 이어서, 화면용 JSON 까지 만들어
# 저장소에 커밋합니다. 커밋되면 Vercel 이 알아서 배포합니다.
name: 수집 (실거래가 → 지오코딩 → 분석 → 화면)

on:
  workflow_dispatch:
    inputs:
      stage:
        # **코드 한 줄 고치려고 3시간을 쓰지 않기 위한 입력입니다.**
        #
        # run 21 의 실제 비용을 보면 어디에 시간이 가는지 분명합니다.
        #
        #   실거래가 수집      0초    ← 다 받았습니다
        #   지오코딩       2시간 58분  ← 브이월드 하루 3만건에 묶여 있습니다
        #   조인               9분
        #   분석 + 화면        3분
        #
        # 화면 색을 고치거나 분석을 다시 돌리는 데 필요한 것은 뒤의 12분
        # 뿐인데, 지금까지는 매번 앞의 3시간을 같이 돌았습니다.
        #
        #   all      수집 → 지오코딩 → 조인 → 분석 → 화면   (하루 한 번)
        #   analyze  조인 → 분석 → 화면                     (약 40분)
        #   web      화면만                                 (약 3분)
        #
        # **web 은 화면 코드만 고쳤을 때를 위한 것이다.** 요구사항
        # (2026-09-08): "너무 오래 걸리면 우선 테마부터 푸쉬하는 걸
        # 추천합니다."
        #
        # 라이브(main)는 이 워크플로의 'main fast-forward' 단계만 앞당긴다.
        # 그래서 CSS 한 줄을 고쳐도 사이트에 보이려면 40분을 기다려야 했다.
        # web 은 캐시에서 자료를 되살려 화면 JSON 만 다시 만들고 곧바로
        # main 을 앞당긴다 — 조인(9분)·H3(7분)·패널·가설·캐시 보관(13분)을
        # 전부 건너뛴다.
        description: "무엇까지 돌릴지"
        type: choice
        options: [all, analyze, web]
        default: all
      start:
        # 토지·공장 가격은 경제 순환을 탄다. 두세 해만 보면 순환의 한 국면을
        # 효과로 착각한다. 그래서 받을 수 있는 만큼 길게 받는다.
        #
        # **2006-01 이 바닥이다.** 실거래 신고 의무가 그때 시작됐고, 그 이전
        # 거래는 국가가 갖고 있지 않다. 2003년으로 내려도 빈 응답만 온다.
        description: "수집 시작 (YYYY-MM) — 2006-01 이 실거래의 시작점"
        default: "2006-01"
      end:
        # 2026년은 아직 진행 중이라 연 단위 비교에 쓸 수 없다.
        description: "수집 끝 (YYYY-MM)"
        default: "2025-12"
      kind:
        description: "물건 종류 (쉼표구분)"
        default: "land,factory"
      region:
        # 전국으로 방향을 정했으므로(2026-09-02 지시 3) 기본을 nationwide 로
        # 둔다. 휴대폰에서 매번 손으로 고쳐 넣게 하면 언젠가 빠뜨리고,
        # 그러면 표가 비어도 '거래가 없구나' 로 읽힌다.
        description: "권역 (nationwide · pilot_regions.yaml 의 이름 쉼표구분 · all)"
        default: "nationwide"
      workers:
        description: "실거래가 동시 요청 수 (기본 6, 차단당하면 낮추세요)"
        default: "6"
      max_cells:
        # 전국 × 2006~2025 는 셀이 11만 개가 넘는다. 운영계정 하루 한도(10만)를
        # 한 번에 못 넘기므로 나눠 돈다. 남은 셀은 다음 실행이 이어받는다.
        description: "이번 실행에서 처리할 최대 셀 수 (0=제한없음)"
        default: "35000"
      landchar_scope:
        # 어디까지 필지 특성을 받을지. 요구사항(2026-09-08):
        # "필지 특성 대상을 전국 전체로 넓혀 주세요."
        #
        #   core  밴드 안 · 계획관리·생산관리·자연녹지 · 토지만 (옛 기본값)
        #   land  전국 · 용도지역 전부 · 토지만
        #   all   전국 · 용도지역 전부 · 토지 + 공장/창고
        #
        # **지번 좌표 조건은 어느 범위에서도 안 푼다.** 법정동 중심점은
        # 오차가 ±1~2km 라 엉뚱한 필지가 붙는데, 그것은 자료가 없는
        # 것보다 나쁘다.
        description: "필지 특성 범위 (core/land/all)"
        type: choice
        options: [all, land, core]
        default: all
      landchar_tiles:
        # 필지 특성(도로접·형상·지세). 거래가 있는 칸만 훑고, 칸 단위로
        # 재개하므로 한 번에 다 안 해도 된다. 0 이면 이번 실행은 건너뛴다.
        #
        # 실측(남이천·안성): 칸 하나에 4~5초. 2,000칸이면 세 시간쯤이다.
        description: "필지 특성을 훑을 최대 칸 수 (0=건너뜀)"
        default: "0"
      probe:
        # 원천 탐침. **기억으로 답하지 않기 위한 입력이다.** 새 자료를
        # 붙이기 전에 "그 API 가 정말 그것을 주는가" 를 한 번 받아서
        # 찍어 본다. 수집을 건드리지 않으므로 아무 때나 켜도 안전하다.
        #
        #   none       아무것도 안 한다 (기본)
        #   office     도청·시청·군청·구청 좌표를 어디서 받을 수 있는가
        #   cadastral  연속지적도로 지오코딩을 대체할 수 있는가
        #              (요구사항 2026-09-08: "탐침해봅시다")
        #   umdpop     읍·면·동 인구를 KOSIS 에서 받을 수 있는가
        #              (요구사항 2026-09-09: "적용합니다")
        description: "원천 탐침 (없으면 none)"
        type: choice
        options: [none, office, cadastral, umdpop]
        default: none
      geocode_limit:
        # 4,000 은 근거 없이 박아둔 숫자였다. 브이월드 안내는 하루 3만건이고
        # 초과신청도 받는다. 예전에는 한도에 걸려도 '주소 없음' 과 구별이
        # 안 돼서 진짜 한도를 알 수 없었다.
        #
        # 이제 한도에 걸리면 멈추고 몇 건째였는지 찍는다. 넉넉히 잡아 두면
        # 그 숫자가 곧 측정값이 된다. 남은 것은 캐시를 건드리지 않으므로
        # 다음 실행이 그대로 이어받는다 — 크게 잡아도 잃는 것이 없다.
        description: "이번 실행에서 지오코딩할 최대 건수 (한도에 걸리면 알아서 멈춥니다)"
        default: "30000"

# 결과를 저장소에 다시 커밋해야 하므로 쓰기 권한이 필요합니다.
permissions:
  contents: write
  # 캐시 사용량을 스스로 읽어 찍고, 넘친 만큼 **스스로 지우기** 위해서다.
  # 휴대폰에서 확인하므로, 한도에 얼마나 다가갔는지를 찾아다니지
  # 않고 실행 로그에서 바로 보이게 한다.
  actions: write

# 같은 워크플로가 겹쳐 돌면 커밋이 충돌하므로 한 번에 하나만.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    # 한국 공공 API 는 해외 IP 를 막는다 (docs/finding-geoblock.md).
    # 러너는 미국이므로 서울 리전 중계기를 거친다. 인증키는 Vercel 쪽에만 있고
    # 여기에는 중계기 주소와 토큰만 둔다.
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 클론(기본 depth 1)이면 브랜치와 원격의 공통 조상을 모른다.
          # 그 상태로 rebase 하면 git 이 모든 파일을 '양쪽에서 새로 만든 파일'
          # 로 보고 add/add 충돌을 낸다. run 13 이 그렇게 죽었다 — 2시간 33분
          # 수집을 마치고 마지막 커밋 단계에서 40개 파일이 전부 충돌했다.
          # 저장소 이력이 16MB 라 전부 받아도 몇 초다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 받아둔 것을 다음 실행에서 이어받기 위해 DB 와 지오코딩 캐시를 보관합니다.
      # 실행마다 새 키로 저장하고, 복원은 가장 최근 것을 씁니다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}
          restore-keys: redt-data-

      # 화면만 다시 뽑는 실행(stage: web)은 캐시만 읽는다 — 키도 네트워크도
      # 쓰지 않는다. 그런데도 여기서 실호출을 세 번 하다가 중계기가 아프면
      # **프런트 배포가 빨갛게** 됐다 (run 58~60). 원인과 상관없는 곳에
      # 빨간불이 켜지면, 나중에 진짜 빨간불도 안 읽게 된다.
      - name: 점검 (키·네트워크)
        if: inputs.stage != 'web'
        run: python -m redt.cli doctor

      # 영업소 엔드포인트가 아직 확정되지 않았다 (P2-3).
      # 여기서 멈추면 실거래가 수집까지 못 하므로 넘어간다. link 도 마찬가지.
      - name: 영업소 마스터
        if: inputs.stage == 'all'
        continue-on-error: true
        run: python -m redt.cli tollgates

      # 교통량을 먼저 싣는다. 어떤 영업소가 마스터에 없는지 알아야 보충할 수
      # 있고, 보충한 뒤에 공간 조인을 해야 새 영업소에도 거래가 붙는다.
      # 순서가 어긋나면 민자 영업소가 지도에는 뜨는데 거래는 0 으로 보인다.
      - name: 교통량 적재 (저장소의 연간 CSV)
        if: inputs.stage == 'all'
        continue-on-error: true
        run: python -m redt.cli load-traffic

      # 영업소 마스터(도로공사 API)에는 민자고속도로가 없다. 교통량 파일과
      # 도로공사 명부에는 있으므로, 이름으로 좌표를 찾아 채운다
      # (docs/tollgate-coverage.md).
      #
      # 명부를 등재하면서 대상이 늘었다. 교통량이 아예 없는 민자 영업소
      # 163곳이 여기서 처음 좌표를 받는다 — 마도(805)가 그중 하나다.
      # 이름 하나에 접미사 다섯 개까지 물으므로 최대 800여 회, 브이월드
      # 하루 한도(3만) 안에서 충분하다.
      - name: 영업소 보충 (민자 등)
        if: inputs.stage == 'all'
        continue-on-error: true
        run: python -m redt.cli fill-tollgates

      # 전국 코드를 아직 안 찾았으면 여기서 한 번 찾는다. 결과가
      # config/sigungu_codes.yaml 에 남아 다음부터는 건너뛴다.
      #
      # '남는다' 가 성립하려면 그 파일을 저장소에 되돌려 놔야 한다. run 13 은
      # 이 단계에 1시간 35분과 호출 19,052회를 쓰고도 커밋 대상이
      # public/app/data 뿐이라 결과를 통째로 잃었다 (캐시 경로에도 config 가
      # 없다). 아래 '결과 커밋' 이 이 파일도 함께 담는다.
      - name: 전국 시군구 코드 확보
        if: inputs.stage == 'all' && contains(inputs.region, 'nationwide')
        run: python -m redt.cli discover-sigungu

      - name: 실거래가 수집
        if: inputs.stage == 'all'
        run: |
          python -m redt.cli trades \
            --kind "${{ inputs.kind }}" \
            --region "${{ inputs.region }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --max-cells "${{ inputs.max_cells }}" \
            --workers "${{ inputs.workers }}"

      # 눈감고 앞에서부터 4,000건씩 붙이면 좌표 없는 329만 건을 다 붙이는 데
      # 822번을 돌려야 한다. **전국에 좌표를 붙일 필요가 없다** — 거리 밴드에
      # 들어갈 수 있는 거래에만 지번 좌표가 필요하다.
      #
      # 그래서 법정동 중심점을 먼저 붙이고(법정동 하나당 한 번, 캐시되므로
      # 거래 건수와 무관하다), 영업소 반경 안에 드는 법정동의 거래만 지번으로
      # 올린다. 근거리 밴드는 지번 좌표만 받으므로(require_parcel_bands)
      # 반경 밖에 쓰는 호출은 밴드에 한 건도 보태지 못한다.
      - name: 지오코딩 (법정동 먼저 → 반경 안만 지번)
        if: inputs.stage == 'all'
        run: |
          python -m redt.cli geocode-staged \
            --limit "${{ inputs.geocode_limit }}"

      - name: 거래 ↔ 영업소 공간 조인
        if: inputs.stage != 'web'
        continue-on-error: true
        run: python -m redt.cli link

      - name: 적재 현황
        if: inputs.stage != 'web'
        run: python -m redt.cli status

      # 며칠에 걸쳐 나눠 받으므로, 전체 중 어디까지 왔는지가 매 실행에서
      # 보여야 한다. 안 보이면 몇 번을 더 돌려야 하는지 알 수 없다.
      - name: 수집 진행률
        if: inputs.stage != 'web'
        run: python -m redt.cli progress

      # 여기부터는 실패해도 수집 결과는 지키도록 계속 진행합니다.
      # 공장과 창고가 실제로 갈리는지. 15126470 은 '공장 및 창고 등'
      # 자료라 창고가 처음부터 같이 들어와 있었는데, 무엇으로 가를 수
      # 있는지는 문서에 없다. 돌려 봐야 안다 — 안 찍으면 화면의
      # '창고 0건' 을 '창고 거래가 없다' 로 읽게 된다.
      - name: 공장·창고 구분 확인
        if: inputs.stage != 'web'
        continue-on-error: true
        run: |
          python -m redt.cli usage-mix 2>&1 | tee /tmp/usage.log
          # 실행 요약에도 적는다. 로그는 실행이 지나가면 찾아 들어가야
          # 보이는데, 이 표는 '창고 칸이 왜 비었나' 를 묻게 되는 바로
          # 그 순간에 필요하다.
          {
            echo "## 공장·창고 구분"
            echo
            echo '```'
            cat /tmp/usage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 영업소 누락 진단
        if: inputs.stage != 'web'
        continue-on-error: true
        run: python -m redt.cli gaps

      # 가설3 통제(시군구 인구·산단·택지). 파일이 저장소에 있으면 적재하고,
      # 없으면 이 단계만 빨갛게 되고 나머지는 그대로 간다. 지금까지 이
      # 단계가 파이프라인에 아예 없어서 H3 통제가 늘 비어 있었다.
      # 필지 특성 — 도로접·형상·지세.
      #
      # 조인 **뒤**에 둔다. 어느 거래가 밴드 안인지 알아야 받을 대상을
      # 고를 수 있고, 그것이 trade_tollgate_link 다. 그리고 패널 **앞**에
      # 두어야 이번 실행의 헤도닉이 바로 쓴다.
      #
      # 요구사항(2026-09-07)와 실측: 차가 들어가느냐가 값을 +66~67%
      # 가르는데 헤도닉이 그것을 안 쓰고 있었다.
      - name: 필지 특성 (도로접·형상)
        if: inputs.stage != 'web' && inputs.landchar_tiles != '0'
        continue-on-error: true
        run: |
          python -m redt.cli landchar \
            --scope "${{ inputs.landchar_scope }}" \
            --max-tiles "${{ inputs.landchar_tiles }}" 2>&1 | tee /tmp/landchar.log
          {
            echo "## 필지 특성 (도로접·형상)"
            echo
            echo '```'
            tail -n 40 /tmp/landchar.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 관청 좌표 원천 탐침. 인구 원의 중심을 도청·시청·군청·구청으로
      # 옮기려면 그 좌표가 있어야 하는데 우리에게 없다. 어디서 받을지를
      # 추측으로 정하지 않기 위해, 실제로 받아서 무엇이 오는지 찍는다.
      # 요구사항(2026-09-07).
      - name: 관청 좌표 탐침
        if: inputs.stage != 'web' && inputs.probe == 'office'
        continue-on-error: true
        run: |
          python scripts/office_probe.py 2>&1 | tee /tmp/office.log
          {
            echo "## 관청 좌표 원천 탐침"
            echo
            echo '```'
            tail -n 120 /tmp/office.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 관청(도청·시청·군청·구청) 좌표. 인구 원의 중심으로 쓴다.
      # 요구사항(2026-09-07).
      #
      # **시도 이름도 여기서 온다.** 실거래 API 응답에 시도가 없어서
      # trade.sido 가 늘 비어 있고(collect/rtms.py), 그래서 화면이
      # 시·도 단위로 묶을 근거가 없었다. 관청 도로명주소의 첫 마디가
      # 우리가 가진 유일한 출처다.
      #
      # 한 번 담으면 다시 안 받는다(이미 있는 것은 건너뛴다). 시군구가
      # 늘거나 청사가 옮기면 --refresh 로 다시 받는다.
      - name: 관청 좌표 (도청·시청·군청·구청)
        if: inputs.stage != 'web'
        continue-on-error: true
        run: |
          python -m redt.cli offices 2>&1 | tee /tmp/offices.log
          {
            echo "## 관청 좌표"
            echo
            echo '```'
            tail -n 40 /tmp/offices.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 연속지적도 탐침. 수집을 건드리지 않고 **읽기만 한다** —
      # 브이월드 지오코더 한도(하루 3만~4만)를 호출 0 으로 대체할 수
      # 있는지 본다. 실거래에 좌표를 붙이는 유일한 병목이다.
      #
      # stage 를 안 본다. 읽기만 하는 탐침 하나를 보려고 조인 9분과
      # 분석을 같이 돌 이유가 없다 — 캐시는 어느 stage 에서나 복원되므로
      # `stage: web` 과 함께 켜면 4분이면 답이 나온다.
      - name: 연속지적도 탐침
        if: inputs.probe == 'cadastral'
        continue-on-error: true
        run: python scripts/cadastral_probe.py

      # 읍·면·동 인구. 표 ID 를 기억으로 적지 않는다 — KOSIS 검색으로
      # 찾아서 쓴다. 코드가 법정동인지 행정동인지가 급소다.
      - name: 읍면동 인구 탐침
        if: inputs.probe == 'umdpop'
        continue-on-error: true
        run: python scripts/umdpop_probe.py

      # 읍·면·동 인구 (KOSIS 행정동 표 DT_1B04005N, 2011년~).
      #
      # 한 해가 한 번의 호출이라 값싸다 — 이미 받은 해는 건너뛴다.
      # 실패해도 나머지를 세우지 않는다: 인구가 없으면 땅값 글자 옆
      # (XX만)만 안 붙고 화면은 그대로 돈다.
      - name: 읍면동 인구 (KOSIS)
        if: inputs.stage != 'web'
        continue-on-error: true
        run: python -m redt.cli umd-pop --start 2011 --end 2025

      - name: 가설3 자료 적재
        if: inputs.stage != 'web'
        continue-on-error: true
        run: python -m redt.cli load-h3

      - name: 분석 패널
        if: inputs.stage != 'web'
        continue-on-error: true
        run: python -m redt.cli panel

      # 계수가 로그에 안 남으면 무엇이 나왔는지 알 수 없습니다.
      - name: 밴드별 탄력성
        if: inputs.stage != 'web'
        continue-on-error: true
        run: |
          python -m redt.cli analyze --volume total
          python -m redt.cli analyze --volume freight

      # 지시2·3 — 개통 전후(인과에 가장 가까운 비교)와 교통량 순위 횡단 비교.
      - name: 신규 개통 전후 지가 (이중차분)
        if: inputs.stage != 'web'
        continue-on-error: true
        run: python -m redt.cli events

      - name: IC 교통량 순위 대비 주변 지가
        if: inputs.stage != 'web'
        continue-on-error: true
        run: |
          python -m redt.cli rank --volume total
          python -m redt.cli rank --volume freight

      # 지시13 — 세 가설을 한 자리에서 판정한다. 계수가 로그에만 남으면
      # 실행이 끝나는 순간 무엇이 나왔는지 아무도 모른다. 이 단계는
      # public/app/data/verdicts.json 으로 남기고(아래 '결과 커밋' 이
      # 가져간다) 실행 요약 칸에도 표를 적는다.
      # 토지와 공장을 나란히 낸다. 지금까지 토지만 저장돼서, 공장은
      # '표본이 작아 못 봤다' 는 것조차 화면에 안 남았다.
      #
      # 판정은 토지·전체 교통량에서만 한다(주 가설). 공장은 탐색이고 표에
      # 그렇게 적힌다 — 계수를 여럿 던지면 그중 몇은 우연히 유의하다.
      - name: 다섯 가설 판정
        if: inputs.stage != 'web'
        continue-on-error: true
        run: |
          python -m redt.cli hypotheses --kind land
          python -m redt.cli hypotheses --kind factory \
            --out verdicts_factory.json

      - name: 스코어 산출
        if: inputs.stage != 'web'
        continue-on-error: true
        run: python -m redt.cli score

      - name: 화면용 JSON 생성
        continue-on-error: true
        run: python -m redt.cli export-web

      # continue-on-error 가 실패를 가려서, 분석이 통째로 실패했는데도
      # 초록색으로 끝난 적이 있습니다. 결과물이 실제로 나왔는지 봅니다.
      - name: 결과 확인
        run: |
          if [ ! -f data/processed/panel.parquet ]; then
            # **원인을 두 가지로 가른다.** run 83 에서 '캐시가 비었으니
            # analyze 로 채우세요' 라고 적어 놓고 실제 원인은 그것이
            # 아니었다 — 2GB 짜리 캐시를 받다가 시간이 초과됐다
            # (Failed to restore: The operation cannot be completed in
            # timeout). 시키는 대로 analyze 를 돌리면 같은 자리에서 또
            # 멈춘다. 틀린 안내는 없는 안내보다 나쁘다.
            if [ ! -f data/processed/redt.duckdb ]; then
              echo "::error::DB 가 없습니다 — 복원이 안 됐다는 뜻입니다."
              echo "::error::위 '이전 수집분 복원' 단계의 로그를 먼저 보세요."
              echo "::error::  · 'Cache not found' 면 정말 캐시가 비었습니다."
              echo "::error::    (analyze 를 한 번 돌려 채우거나, vault 로 복원하세요)"
              echo "::error::  · 'Failed to restore ... timeout' 이면 캐시가 커서"
              echo "::error::    받다 끊긴 것입니다. 다시 돌리면 대개 붙습니다."
            else
              echo "::error::DB 는 있는데 패널이 없습니다 — 분석이 죽었습니다."
              echo "::error::위 '분석 패널' 단계의 로그를 보세요."
            fi
            python -m redt.cli status || true
            exit 1
          fi
          echo "패널 생성 확인"

          # continue-on-error 가 실패를 초록으로 덮는다. run 27 이 그랬다 —
          # 세 가설 판정이 KeyError 로 죽었는데 실행은 성공으로 끝났고,
          # 판정 파일은 **전 실행 것 그대로** 커밋됐다. 낡은 숫자가 새
          # 숫자인 척하는 것이 아무 숫자도 없는 것보다 나쁘다.
          # **web 실행은 판정을 새로 만들지 않는다.** 그래서 신선도
          # 검사를 그대로 걸면 늘 빨갛게 된다. 대신 화면 자료가 방금
          # 만들어졌는지를 본다 — export-web 이 조용히 죽는 것을 놓치면
          # 낡은 화면이 새것인 얼굴로 나간다.
          if [ "${{ inputs.stage }}" = "web" ]; then
            python scripts/check_fresh.py public/app/data/meta.json --max-age-min 30
          else
            python scripts/check_fresh.py public/app/data/verdicts.json --max-age-min 180
          fi

      # 결과를 브랜치에 되돌려 놓는다.
      #
      # **rebase 로 하면 안 된다.** run 24 가 그렇게 실패했다.
      #
      # 실행이 도는 동안 브랜치에 새 커밋이 올라가면, 우리 데이터 커밋을
      # 그 위로 rebase 하게 된다. 그런데 양쪽이 고치는 파일이 똑같다 —
      # public/app/data/*.json 은 매 실행이 통째로 다시 쓴다. 충돌이
      # 안 날 수가 없다.
      #
      # 그리고 충돌하면 그냥 실패로 끝나지 않는다. **작업 트리가 rebase
      # 중간 상태로 남는다.** run 24 에서는 chart.json 이 빈 파일이 됐고,
      # 뒤따르는 라이브 반영 단계가 그것을 잡아냈다("표준 JSON 이
      # 아닙니다"). 안전장치가 없었으면 빈 파일이 프로덕션에 나갔다.
      #
      # 이 파일들은 **생성물**이지 손으로 고치는 것이 아니다. 합칠 이유가
      # 없다. 그래서 합치지 않는다:
      #
      #   1) 방금 만든 것을 옆에 치워 둔다
      #   2) 브랜치 최신으로 깨끗이 맞춘다 (reset --hard)
      #   3) 치워 둔 것을 다시 놓고 커밋한다
      #
      # 충돌이 원천적으로 없다. 경합이 나면(그 사이 또 누가 올리면) 푸시가
      # 거절되므로 처음부터 다시 한다.
      # ── 산 것을 보관한다 ──
      #
      # **자리가 이 두 가지를 동시에 만족해야 한다.**
      #
      #   (1) 이번 실행이 산 것보다 뒤   필지 특성·관청 좌표가 들어가야 한다
      #   (2) 조인 결과를 뺀 뒤          1,961만 행을 캐시에 이고 다니면
      #                                 한 번이 4.7GB 가 되고, 한도 10GB
      #                                 안에서 실행 두 번치도 안 남는다
      #
      # 조인은 분석이 끝날 때까지 필요하므로, 두 조건을 함께 만족하는
      # 자리는 여기뿐이다.
      #
      # 예전에는 지오코딩 직후에, 그것도 stage=all 일 때만 저장했다.
      # "분석만 도는 실행은 새로 산 것이 없으므로" 라는 이유였고 그때는
      # 맞는 말이었다. 필지 특성과 관청 좌표를 파이프라인에 넣은 순간
      # 틀린 말이 됐는데 주석만 남고 아무도 안 고쳤다.
      #
      # 그 대가가 run 37~40 이다. 네 번 다 3,000칸씩 훑고 네 번 다
      # 버렸다. 로그가 매번 이렇게 말하고 있었는데 그냥 지나쳤다:
      #
      #     칸 6,677개 중 아직 안 훑은 것 6,677개
      #
      # 15분짜리 수집이 네 번 헛돌았다.
      - name: 캐시 앞 정리 (조인 결과는 매번 다시 만든다)
        if: always() && inputs.stage != 'web'
        continue-on-error: true
        run: python -m redt.cli compact-db

      # always() 인 이유 — 뒤 단계가 죽어도 산 것은 지켜야 한다.
      # 지오코딩이 run 21 에서 2시간 58분 걸렸고, 러너가 죽어 그 시간이
      # 통째로 사라진 적이 있다(run 17).
      - name: 수집분 보관 (산 뒤에, 실행당 한 번)
        if: always() && inputs.stage != 'web'
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}-mid

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"

          # 되돌려 놓을 것. 시군구 코드는 한 번 찾는 데 1시간 35분·
          # 호출 19,052회가 든다 — 저장소에 남겨야 다음 실행이 건너뛴다.
          KEEP="public/app/data"
          if [ -f config/sigungu_codes.yaml ]; then
            KEEP="$KEEP config/sigungu_codes.yaml"
          fi

          SAVE="$(mktemp -d)"
          for path in $KEEP; do
            mkdir -p "$SAVE/$(dirname "$path")"
            cp -r "$path" "$SAVE/$(dirname "$path")/"
          done

          for i in 1 2 3 4; do
            git fetch origin "$BRANCH"
            # 합치지 않고 브랜치 최신에 맞춘다. 우리가 되돌려 놓을 것은
            # 위에서 이미 치워 뒀다.
            git reset --hard "origin/$BRANCH"
            for path in $KEEP; do
              rm -rf "$path"
              mkdir -p "$(dirname "$path")"
              cp -r "$SAVE/$path" "$(dirname "$path")/"
            done
            git add $KEEP
            if git diff --cached --quiet; then
              echo "바뀐 화면 데이터가 없습니다 — 커밋 생략"
              exit 0
            fi
            git commit -m "data: 수집 run ${{ github.run_number }} 결과 (화면 데이터·시군구 코드)"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            # 그 사이 누가 또 올렸다. 처음부터 다시 — 우리 생성물은
            # $SAVE 에 그대로 있으므로 잃는 것이 없다.
            echo "  푸시가 거절됐습니다. 브랜치를 다시 받아 시도합니다 ($i/4)"
            sleep $((2 ** i))
          done
          echo "푸시 실패"; exit 1

      # 라이브 반영 — main 을 이 브랜치로 fast-forward 합니다.
      #
      # **Vercel 은 main 만 프로덕션으로 배포합니다.** 브랜치에 푸시하면
      # preview URL 만 생기고 toji.fyi 는 그대로입니다. 그래서
      # 9월 3~4일 사이 19개 커밋(거래 점 가시성·도로 위계·용도지역 색·
      # 순위 탭 수정·run 21 데이터)이 전부 라이브에 없었습니다. 배포 목록에
      # READY 라고 떠도 target 이 preview 면 실사용 화면은 안 바뀝니다.
      #
      # 사람이 매번 머지하게 두면 언젠가 또 빠집니다. 실행이 스스로 합니다.
      #
      # 규칙 셋 — 이 셋이 없으면 자동화가 사고를 키웁니다.
      #
      #   1) **fast-forward 만.** --force 는 쓰지 않습니다. main 이 갈라져
      #      있으면 밀지 않고 크게 알립니다. 남이 main 에 직접 올린 것을
      #      우리가 지우는 일이 자동으로 일어나서는 안 됩니다.
      #   2) **화면 JSON 이 읽히는지 먼저 봅니다.** 깨진 JSON 이 올라가면
      #      브라우저가 조용히 탭 하나를 꺼버립니다 — traffic.json 이 NaN 을
      #      담아 순위 탭이 꺼져 있던 그 사고입니다. 오류도 안 납니다.
      #   3) main 에서 돌 때는 아무것도 안 합니다.
      #
      # 실패해도 실행을 빨갛게 만들지 않습니다(continue-on-error). 수집
      # 3시간이 성공했는데 배포 한 줄 때문에 '실패' 로 보이면 다음부터
      # 빨간 표시를 안 읽게 됩니다. 대신 요약칸에 크게 적습니다 — 휴대폰에서
      # 실행 페이지를 열면 맨 위에 보입니다.
      - name: 라이브 반영 (main fast-forward)
        if: always() && github.ref_name != 'main'
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in public/app/data/*.json; do
            if ! python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "::error::$f 가 표준 JSON 이 아닙니다 — 라이브에 반영하지 않습니다."
              {
                echo "### ⛔ 라이브 반영 안 함"
                echo "\`$f\` 가 표준 JSON 이 아닙니다. 올라가면 화면 탭이 조용히 꺼집니다."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then
            echo "main 이 이미 같습니다 — 반영할 것 없음"
            exit 0
          fi
          # main 이 우리보다 **앞서** 있는 경우. 실행이 도는 동안 브랜치에
          # 새 커밋이 올라가고 그것이 먼저 main 에 반영되면 이렇게 된다.
          # 갈라진 것이 아니라 이미 지나간 것이므로 조용히 넘어간다 —
          # 여기서 '갈라졌다' 고 알리면 거짓 경보가 되고, 거짓 경보가
          # 몇 번 뜨면 진짜 경보도 안 읽게 된다.
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "main 이 이미 이 커밋을 담고 있습니다 — 반영할 것 없음"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main 이 이 브랜치에서 갈라져 있습니다 — fast-forward 가 아니므로 밀지 않습니다."
            {
              echo "### ⛔ 라이브 반영 안 함"
              echo "main 이 갈라졌습니다. 누가 main 에 직접 올렸는지 확인이 필요합니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin "HEAD:main"
          {
            echo "### ✅ 라이브 반영 완료"
            echo "main 을 \`${{ github.ref_name }}\` 로 올렸습니다."
            echo "잠시 뒤 https://toji.fyi/ 에 반영됩니다."
          } >> "$GITHUB_STEP_SUMMARY"

      # 커밋이 막혀도 결과물은 손에 쥘 수 있게 올려 둔다. run 13 은 수집을
      # 다 마치고도 화면 데이터를 받아볼 방법이 없었다.
      - name: 화면용 JSON 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-data-${{ github.run_number }}
          path: public/app/data

      # 용량을 매 실행이 스스로 찍는다.
      #
      # 캐시 한도는 저장소당 10GB 이고, 넘치면 **오래된 것부터 조용히
      # 지워진다.** 지오코딩 3시간이 든 캐시가 그렇게 밀려나면 그 3시간을
      # 다시 써야 하는데, 밀려났다는 사실은 다음 실행이 처음부터 다시
      # 받기 시작할 때에야 드러난다.
      #
      # 찾아가 봐야 아는 숫자는 아무도 안 본다. 여기 찍어 두면 실행
      # 로그를 열 때마다 눈에 들어온다.
      # 오래된 캐시를 지운다.
      #
      # run 23 이 12.35GB / 10GB (124%) 를 찍었다. 넘치면 GitHub 이
      # **오래된 것부터 조용히 지운다** — 그 사실은 다음 실행이 처음부터
      # 다시 받기 시작할 때에야 드러난다. 지오코딩이 든 캐시가 그렇게
      # 밀려나면 몇 시간을 다시 쓴다.
      #
      # 우연에 맡기지 않고 **우리가 고른다.** 최근 것 KEEP 개만 남기고
      # 나머지를 지운다. 방금 저장한 것이 가장 최근이므로 안전하다.
      #
      # 지우기 전에 반드시 확인하는 것 하나: **지금 도는 실행이 만든
      # 캐시는 건드리지 않는다.** 같은 실행의 캐시를 지우면 그 실행이
      # 이어받을 것을 스스로 없애는 셈이다.
      - name: 오래된 캐시 정리 (10GB 한도)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prune_caches.py --keep 3

      - name: 용량 (캐시·실행시간)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              r = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(r, timeout=20))

          GB = 2 ** 30
          LIMIT = 10 * GB          # GitHub 저장소당 Actions 캐시 한도
          u = api("/actions/cache/usage")
          used = u["active_caches_size_in_bytes"]
          n = u["active_caches_count"]
          print("=== Actions 캐시 ===")
          print(f"  {used/GB:.2f} GB / 10 GB  ({used/LIMIT:.0%}) · {n}개")
          if used > LIMIT * 0.8:
              print("  ⚠ 80% 를 넘었습니다. 넘치면 오래된 것부터 지워지고,")
              print("    지오코딩이 든 캐시가 밀려나면 그 시간을 다시 씁니다.")
              print("    → github.com/%s/actions/caches 에서 오래된 것을 지우세요" % repo)

          caches = api("/actions/caches?per_page=20")["actions_caches"]
          if caches:
              print("  큰 것부터")
              for c in sorted(caches, key=lambda x: -x["size_in_bytes"])[:6]:
                  print(f"    {c['size_in_bytes']/GB:5.2f} GB  {c['key']}"
                        f"  (마지막 사용 {c['last_accessed_at'][:10]})")

          # ── 이번 달 실행 시간 ──
          #
          # 청구 화면(settings/billing)은 **한도를 넘긴 뒤에야** 숫자가
          # 보입니다. 포함된 분 안에서 쓰는 동안은 비어 보여서, 얼마나
          # 다가갔는지 알 수가 없습니다. "못 찾겠다" 고 한
          # 것이 그래서입니다. 그래서 실행 기록에서 직접 셉니다.
          #
          # **다만 이것은 청구액이 아니라 벽시계 시간입니다.** 예전에는
          # 이 값을 Free 2,000분 · Pro 3,000분 한도와 나란히 찍었는데,
          # 그것이 사람을 잘못 이끌었습니다 — 2,570분을 보고 "한도의
          # 86%" 라고 보고했다가, 실제 청구 기록을 열어 보니 0 이었습니다.
          #
          #     /actions/runs/{id}/timing
          #     {"billable": {"UBUNTU": {"total_ms": 0}}, "run_duration_ms": 2253000}
          #
          # 공개 저장소는 표준 러너 사용이 청구되지 않기 때문입니다.
          # 그래서 이제 **청구 기록을 직접 물어봅니다.** 추측한 한도와
          # 비교하는 대신, GitHub 이 실제로 얼마를 청구했는지 찍습니다.
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          month = now.strftime("%Y-%m")
          total, counted, page = 0.0, 0, 1
          while page <= 4:
              runs = api(f"/actions/runs?per_page=100&page={page}")["workflow_runs"]
              if not runs:
                  break
              stop = False
              for r in runs:
                  st, en = r.get("run_started_at"), r.get("updated_at")
                  if not (st and en):
                      continue
                  if st[:7] < month:          # 지난달로 넘어갔다
                      stop = True
                      continue
                  if st[:7] > month:
                      continue
                  a = datetime.strptime(st, "%Y-%m-%dT%H:%M:%SZ")
                  b = datetime.strptime(en, "%Y-%m-%dT%H:%M:%SZ")
                  total += (b - a).total_seconds() / 60
                  counted += 1
              if stop:
                  break
              page += 1

          # 최근 실행 몇 개의 **실제 청구 기록**을 물어본다. 벽시계
          # 시간과 나란히 놓아야 둘이 다르다는 것이 보인다.
          billed_ms, asked = 0, 0
          for r in api("/actions/runs?per_page=10")["workflow_runs"]:
              try:
                  tm = api(f"/actions/runs/{r['id']}/timing")
              except Exception:
                  continue
              billed_ms += sum(v.get("total_ms", 0)
                               for v in (tm.get("billable") or {}).values())
              asked += 1

          print()
          print(f"=== 이번 달({month}) 실행 시간 ===")
          print(f"  벽시계 {total:,.0f}분 · 실행 {counted}건")
          if asked:
              print(f"  최근 {asked}건의 **청구된** 시간 {billed_ms / 60000:,.0f}분")
              if billed_ms == 0:
                  print("    → 청구 0. 공개 저장소는 표준 러너가 무료입니다.")
                  print("       위 벽시계 시간은 '얼마나 오래 걸리나' 를 볼 때만 쓰세요.")
              else:
                  print("    → 청구되고 있습니다. github.com/settings/billing 에서")
                  print("       남은 분을 확인하세요.")
          PY
          echo

# 버튼 하나로 도는 수집 파이프라인.
#
# PC 도 터미널도 없이, GitHub 웹페이지(휴대폰 포함)에서 Run workflow 를 누르면
# 실거래가를 받아 좌표를 붙이고 영업소와 이어서, 화면용 JSON 까지 만들어
# 저장소에 커밋합니다. 커밋되면 Vercel 이 알아서 배포합니다.
name: 수집 (실거래가 → 지오코딩 → 분석 → 화면)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "수집 시작 (YYYY-MM)"
        default: "2016-01"
      end:
        description: "수집 끝 (YYYY-MM)"
        default: "2025-12"
      kind:
        description: "물건 종류 (쉼표구분)"
        default: "land,factory"
      geocode_limit:
        description: "이번 실행에서 지오코딩할 최대 건수 (일일 한도 대비)"
        default: "4000"

# 결과를 저장소에 다시 커밋해야 하므로 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 같은 워크플로가 겹쳐 돌면 커밋이 충돌하므로 한 번에 하나만.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    # 한국 공공 API 는 해외 IP 를 막는다 (docs/finding-geoblock.md).
    # 러너는 미국이므로 서울 리전 중계기를 거친다. 인증키는 Vercel 쪽에만 있고
    # 여기에는 중계기 주소와 토큰만 둔다.
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 받아둔 것을 다음 실행에서 이어받기 위해 DB 와 지오코딩 캐시를 보관합니다.
      # 실행마다 새 키로 저장하고, 복원은 가장 최근 것을 씁니다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}
          restore-keys: redt-data-

      - name: 점검 (키·네트워크)
        run: python -m redt.cli doctor

      - name: 영업소 마스터
        run: python -m redt.cli tollgates

      - name: 실거래가 수집
        run: |
          python -m redt.cli trades \
            --kind "${{ inputs.kind }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}"

      - name: 지오코딩 (지번 → 좌표)
        run: python -m redt.cli geocode --limit "${{ inputs.geocode_limit }}"

      - name: 거래 ↔ 영업소 공간 조인
        run: python -m redt.cli link

      - name: 적재 현황
        run: python -m redt.cli status

      # 여기부터는 실패해도 수집 결과는 지키도록 계속 진행합니다.
      - name: 분석 패널
        continue-on-error: true
        run: python -m redt.cli panel

      - name: 스코어 산출
        continue-on-error: true
        run: python -m redt.cli score

      - name: 화면용 JSON 생성
        continue-on-error: true
        run: python -m redt.cli export-web

      - name: 수집분 보관
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/data
          if git diff --cached --quiet; then
            echo "바뀐 화면 데이터가 없습니다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: refresh web export from collect run ${{ github.run_number }}"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          echo "푸시 실패"; exit 1

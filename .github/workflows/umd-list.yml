# 전국 법정동 명부를 받는다 (사장님 지시 2026-09-09 "전국구로 확대").
#
# 거래가 없는 읍·면·동은 우리 자료에 이름조차 없어서 지도에서 통째로
# 빠집니다. 그 명부를 행정안전부_행정표준코드에서 받아 옵니다.
#
# **이 명령은 이름만 가져옵니다.** 표준코드 표에는 좌표가 없습니다.
# 좌표는 뒤이어 지오코딩으로 붙입니다.
#
# 러너는 미국이라 한국 공공 API 가 막힙니다. 서울 중계기를 거치고,
# 키는 중계기 쪽에만 있습니다.
name: 전국 법정동 명부 받기

on:
  workflow_dispatch:
    inputs:
      geocode:
        description: "좌표까지 붙일까요 (0 이면 명부만)"
        default: "1"
      limit:
        description: "이번에 몇 곳까지 물을까 (비우면 전부)"
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 우리 자료와 맞대어 보려면 거래 표가 있어야 합니다. 없으면
      # 명부는 받되 '몇 곳이 새로 생기는가' 는 못 셉니다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          # 일부러 안 맞는 열쇠 — restore-keys 로 가장 최근 것을 꺼냅니다.
          key: redt-umdlist-no-such-key
          restore-keys: redt-data-

      - name: 명부 받기
        run: python -m redt.cli umd-list 2>&1 | tee /tmp/umd.log

      # 이름표는 좌표 위에 놓입니다. 명부만으로는 지도에 아무것도 못
      # 올립니다. 표준코드가 좌표를 안 주므로 브이월드로 따로 채웁니다.
      #
      # **이미 아는 곳은 안 묻습니다.** 지오코딩 캐시가 주소 단위라
      # 거래가 있었던 동네는 공짜로 나옵니다. 실제로 묻는 것은 한 번도
      # 안 가 본 곳뿐입니다 — 1,559곳 안팎이라 하루 한도 안에서 끝납니다.
      - name: 좌표 붙이기
        if: inputs.geocode != '0'
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
        run: |
          python -m redt.cli umd-geocode \
            ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }} \
            2>&1 | tee -a /tmp/umd.log

      # **받은 것을 캐시에 되돌려 놓습니다.** 안 그러면 다음 실행이
      # 명부도 좌표도 없는 상태에서 시작해, 브이월드를 처음부터 다시
      # 두드립니다 — 하루 할당량을 통째로 태우는 길입니다.
      - name: 수집분 보관
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}-mid

      - name: 명부 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region-umd
          path: data/raw/region_umd.csv
          if-no-files-found: warn

      - name: 실행 요약
        if: always()
        run: |
          {
            echo "## 전국 법정동 명부"
            echo
            echo '```'
            cat /tmp/umd.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

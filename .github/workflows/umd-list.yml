# 전국 법정동 명부를 받는다 (사장님 지시 2026-09-09 "전국구로 확대").
#
# 거래가 없는 읍·면·동은 우리 자료에 이름조차 없어서 지도에서 통째로
# 빠집니다. 그 명부를 행정안전부_행정표준코드에서 받아 옵니다.
#
# **이 명령은 이름만 가져옵니다.** 표준코드 표에는 좌표가 없습니다.
# 좌표는 뒤이어 지오코딩으로 붙입니다.
#
# 러너는 미국이라 한국 공공 API 가 막힙니다. 서울 중계기를 거치고,
# 키는 중계기 쪽에만 있습니다.
name: 전국 법정동 명부 받기

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 우리 자료와 맞대어 보려면 거래 표가 있어야 합니다. 없으면
      # 명부는 받되 '몇 곳이 새로 생기는가' 는 못 셉니다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          # 일부러 안 맞는 열쇠 — restore-keys 로 가장 최근 것을 꺼냅니다.
          key: redt-umdlist-no-such-key
          restore-keys: redt-data-

      - name: 명부 받기
        run: python -m redt.cli umd-list 2>&1 | tee /tmp/umd.log

      - name: 명부 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region-umd
          path: data/raw/region_umd.csv
          if-no-files-found: warn

      - name: 실행 요약
        if: always()
        run: |
          {
            echo "## 전국 법정동 명부"
            echo
            echo '```'
            cat /tmp/umd.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

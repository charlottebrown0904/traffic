# 개별공시지가·토지특성을 브이월드 WFS 로 실제로 받아 본다.
#
# 서버가 유효한 typename 을 알려줬다: dt_d150(개별공시지가), dt_d194(토지특성).
# 좌표·연도·용도지역이 실제로 오는지 확인한다.
name: 공시지가 받아보기

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "조회 영역 minx,miny,maxx,maxy (EPSG:4326)"
        default: "126.87,37.06,126.93,37.11"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          BBOX: ${{ inputs.bbox }}
        run: python scripts/vworld_landprice.py "$BBOX"

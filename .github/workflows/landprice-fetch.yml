# 개별공시지가·토지특성을 브이월드 WFS/속성 API 로 실제로 받아 본다.
#
# 결과를 로그에만 남기지 않고 저장소에 커밋한다. 로그를 읽으려면 실행
# 목록부터 훑어야 하는데 그 조회가 캐시로 늦고 비쌌다. 파일로 남기면
# git pull 한 번이면 된다.
name: 공시지가 받아보기

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "조회 영역 minx,miny,maxx,maxy (EPSG:4326)"
        default: "126.87,37.06,126.93,37.11"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 탐침
        env:
          BBOX: ${{ inputs.bbox }}
        run: |
          mkdir -p data/raw
          python scripts/vworld_landprice.py "$BBOX" 2>&1 \
            | tee data/raw/landprice_probe.txt
      # 결과를 저장소에 커밋하려 했으나 이 저장소의 Actions 토큰은 읽기
      # 전용이라 403 으로 실패했습니다(run 8). 워크플로에 permissions 를
      # 적어도 저장소 기본값을 넘어설 수 없습니다. 로그로 읽습니다.
      - name: 결과 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: landprice-probe
          path: data/raw/landprice_probe.txt
          retention-days: 7

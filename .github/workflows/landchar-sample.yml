# 토지특성(도로접·형상)을 IC 한 곳에 붙여 보고 **비용을 잰다.**
#
# 요구사항(2026-09-07): "남이천 IC 를 샘플로 봅시다."
#
# 추정치를 드리지 않는다. 전국을 할지 말지는 한 곳의 실측 위에서
# 정해야 한다 — 이 저장소는 지오코딩 시간도 '4,000건' 이라는 근거 없는
# 숫자로 시작했다가 실제로는 하루 3만건이라는 것을 나중에 알았다.
#
# 거래와 붙는지까지 보므로 DB 가 필요하다. 수집 캐시를 복원한다.
name: 토지특성 실측 (IC 한 곳)

on:
  workflow_dispatch:
    inputs:
      tollgate:
        description: "영업소 이름"
        default: "남이천"
      radius:
        description: "반경 km"
        default: "3"
      tile:
        description: "훑는 칸 크기 (도). 잘리면 알아서 넷으로 쪼갭니다"
        default: "0.01"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
      TILE_DEG: ${{ inputs.tile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 거래와 붙는지를 보려면 DB 가 있어야 한다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}
          restore-keys: redt-data-

      - name: 실측
        run: |
          python scripts/landchar_sample.py \
            "${{ inputs.tollgate }}" "${{ inputs.radius }}" 2>&1 | tee /tmp/sample.log

      - name: 실행 요약
        if: always()
        run: |
          {
            echo "## 토지특성 실측 — ${{ inputs.tollgate }} 반경 ${{ inputs.radius }}km"
            echo
            echo '```'
            cat /tmp/sample.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

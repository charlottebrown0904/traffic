# 부동산통계정보(R-ONE) Open API — 지가변동률을 받는다.
#
# 시점수정의 원천이다 (감정평가 실무기준 [610-1.5.2.3.1]①). 요청제한횟수가
# 없어서(명세서 기재) 한 번에 전 기간을 받아도 된다.
#
# 인증키는 중계기(Vercel 환경변수 REB_KEY)에만 있다. 러너는 키를 모른다.
name: 지가변동률 수집

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "reach = 두 길 재기 · probe = 표 확인 · pull = 아티팩트로 · load = DB 에(시점수정) · market = 시장 층(미래 가치)"
        type: choice
        options: ["reach", "probe", "pull", "load", "market"]
        default: "reach"
      table:
        description: "pull 일 때 받을 표 이름 (scripts/reb_stats.py 의 이름)"
        required: false
        default: "지가변동률_용도지역_월"
      from:
        description: "시작 시점 YYYYMM"
        required: false
        default: "201001"
      to:
        description: "종료 시점 YYYYMM"
        required: false
        default: "202608"
      max_pages:
        description: "안전장치 — 중계기를 타면 한 장이 Vercel 함수 호출 한 번"
        required: false
        default: "40"

jobs:
  reb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
      # **있으면 러너가 직접 부르고, 없으면 중계기로 갑니다.**
      # 직접 부르기가 되는 것이 확인되면(mode: reach) 이 시크릿을 넣는 쪽이
      # Vercel 함수 호출·전송량을 0 으로 만듭니다. 없어도 동작합니다.
      REB_KEY: ${{ secrets.REB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 두 길 재기
        if: inputs.mode == 'reach'
        run: PYTHONPATH=src python scripts/reb_stats.py --reach
      - name: 표 확인
        if: inputs.mode != 'reach'
        run: PYTHONPATH=src python scripts/reb_stats.py --probe
      - name: 받기
        if: inputs.mode == 'pull'
        run: |
          PYTHONPATH=src python scripts/reb_stats.py \
            --pull "${{ inputs.table }}" \
            --from "${{ inputs.from }}" --to "${{ inputs.to }}" \
            --max-pages "${{ inputs.max_pages }}"
      # ── load: 시점수정의 원천을 DB 에 넣는다 ────────────────────────
      # pull 은 tsv 를 아티팩트로만 남겨 다음 판이 못 쓴다. load 는 분석이 쓰는
      # DB 캐시(redt-data-*)를 되살려 landprice_index 에 넣고 새 키로 보관한다.
      # 그러면 analyze(export-web) 가 그 캐시를 이어받아 valuation.json 에
      # 지가변동률을 싣는다. 표준지 공시기준일이 그해 1월 1일이므로 from 은
      # 보통 그해 01 이면 된다 — 한 달이 2,700행쯤이라 열 달이 스무 장 안이다.
      # 지역별 표(A_2024_00903)는 안 받는다: run 11 에서 보니 법정동 단위라 한 달이
      # 만 행이고, 용도지역별 표에 시도·시군구·구가 다 들어 있어 쓸 데가 없다.
      - name: 이전 수집분 복원
        if: inputs.mode == 'load'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}
          restore-keys: redt-data-
      - name: DB 에 넣기 (전 지역 · 용도지역별 + 지역별)
        if: inputs.mode == 'load'
        run: |
          test -f data/processed/redt.duckdb || { echo "::error::복원된 DB 가 없습니다 — collect 를 먼저"; exit 1; }
          PYTHONPATH=src python -m redt.cli load-landprice \
            --tables "지가변동률_용도지역_월" --region "" \
            --start "${{ inputs.from }}" --end "${{ inputs.to }}" \
            --max-pages "${{ inputs.max_pages }}"
          PYTHONPATH=src python scripts/reb_time_check.py
      # ── market: 미래 가치의 **시장 층** (docs/future-value.md §3-1) ──────
      # 시점수정(load)은 올해 몇 달이면 되지만, 시장 층은 금리·물가·성장률이
      # 지가변동률을 **몇 달 뒤에 얼마나** 옮기는지를 재는 회귀라 긴 계열이
      # 있어야 한다. 대신 전국 행만 있으면 되므로(필지를 가르지 않는 층이다)
      # 전 기간을 받아도 몇 장이다 — 전국 × 용도지역 10 × 240개월.
      - name: 이전 수집분 복원 (시장 층)
        if: inputs.mode == 'market'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}
          restore-keys: redt-data-
      - name: 거시 계열 (ECOS) → market_series
        if: inputs.mode == 'market'
        run: |
          test -f data/processed/redt.duckdb || { echo "::error::복원된 DB 가 없습니다 — collect 를 먼저"; exit 1; }
          PYTHONPATH=src python -m redt.cli ecos
      - name: 지가변동률 전국 전 기간 → landprice_index
        if: inputs.mode == 'market'
        run: |
          PYTHONPATH=src python -m redt.cli load-landprice \
            --tables "지가변동률_용도지역_월" --region "전국" \
            --start "200601" --end "${{ inputs.to }}" --max-pages "40"
      - name: 시장 층 적합 + 시나리오
        if: inputs.mode == 'market'
        run: PYTHONPATH=src python -m redt.cli market-fit --years 12
      - name: 적합 결과 올리기
        if: always() && inputs.mode == 'market'
        uses: actions/upload-artifact@v4
        with:
          name: market-fit
          path: data/processed/market_fit.json
          if-no-files-found: warn
          retention-days: 7

      - name: 수집분 보관
        if: always() && (inputs.mode == 'load' || inputs.mode == 'market')
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}-reb
      - name: 결과 올리기
        # 잘려도(exit 1) 받은 만큼은 올린다 — 이미 쓴 호출이다.
        if: always() && inputs.mode == 'pull'
        uses: actions/upload-artifact@v4
        with:
          name: reb-stats
          path: data/raw/reb/
          if-no-files-found: warn
          retention-days: 7

# 밴드별 탄력성(β)만 빠르게 다시 뽑는다.
#
# collect 는 지오코딩 때문에 20분 넘게 걸린다. 계수만 보고 싶을 때는
# 직전 수집분(캐시)을 복원해 패널과 분석만 돌린다.
name: 분석만 (밴드별 β)

on:
  workflow_dispatch:
    inputs:
      volume:
        description: "교통량 종류 (total / freight / passenger / mid)"
        default: "total"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 수집은 하지 않는다. 직전 실행이 남긴 DB 를 그대로 쓴다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-analyze-${{ github.run_id }}
          restore-keys: redt-data-

      - name: 복원 확인
        run: |
          if [ ! -f data/processed/redt.duckdb ]; then
            echo "::error::복원된 DB 가 없습니다. 먼저 collect 를 한 번 돌리세요."
            exit 1
          fi
          python -m redt.cli status

      - name: 교통량 적재
        run: python -m redt.cli load-traffic

      # 패널이 얇을 때 원인이 명단인지 좌표인지 거래인지 가른다.
      # 뭉뚱그리면 엉뚱한 곳을 고치게 된다.
      - name: 영업소 누락 진단
        run: python -m redt.cli gaps

      - name: 분석 패널
        run: python -m redt.cli panel

      - name: 밴드별 탄력성
        run: python -m redt.cli analyze --volume "${{ inputs.volume }}"

      # 화물 교통량은 공장·물류 수요를 더 직접 반영한다. 둘을 나란히 봐야
      # '사람이 늘어난 것' 과 '물동량이 늘어난 것' 을 구분할 수 있다.
      - name: 밴드별 탄력성 (화물)
        if: inputs.volume == 'total'
        run: python -m redt.cli analyze --volume freight

      # 지시2 — 개통 전후 비교. 셋 중 인과에 가장 가까운 설계라 매번 같이 본다.
      - name: 신규 개통 전후 지가 (이중차분)
        continue-on-error: true
        run: python -m redt.cli events

      # 지시3 — 같은 지역 안이 아니라 IC 끼리 한 줄로 세워 비교한다.
      - name: IC 교통량 순위 대비 주변 지가
        continue-on-error: true
        run: |
          python -m redt.cli rank --volume total
          python -m redt.cli rank --volume freight

# 수집은 하지 않고, 직전 수집분(캐시)으로 분석만 다시 돌린다.
#
# collect 는 실거래가와 지오코딩 때문에 오래 걸리고 API 하루 한도를 씁니다.
# 계수만 다시 보고 싶을 때, 또는 영업소 명단을 메우고 다시 이어 붙이고 싶을
# 때 이쪽을 씁니다.
name: 분석만 (밴드별 β · 개통 전후 · 교통량 순위)

on:
  workflow_dispatch:
    inputs:
      volume:
        description: "교통량 종류 (total / freight / passenger / mid)"
        default: "total"
      fill_tollgates:
        description: "영업소 명단 보충 + 재연결 (민자 IC 좌표를 이름으로 찾습니다)"
        type: boolean
        default: false
      commit:
        description: "화면용 JSON 을 이 브랜치에 커밋"
        type: boolean
        default: false
      probe_landprice:
        description: "공시지가 시계열 원천(odcloud) 확인"
        type: boolean
        default: false
      probe_h3:
        description: "가설3 원천 확인 (산업단지·인구·택지지구)"
        type: boolean
        default: false

# 화면 데이터를 되돌려 넣을 때 필요합니다.
permissions:
  contents: write

# 보충·재연결은 수집과 같은 캐시를 건드리므로 겹치지 않게 합니다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      # 영업소 보충은 VWorld 를 부릅니다. 한국 API 는 해외 IP 를 막으므로
      # 서울 리전 중계기를 거칩니다 (docs/finding-geoblock.md).
      REDT_RELAY_URL: ${{ secrets.REDT_RELAY_URL }}
      REDT_RELAY_TOKEN: ${{ secrets.REDT_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 수집은 하지 않는다. 직전 실행이 남긴 DB 를 그대로 쓴다.
      - name: 이전 수집분 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-analyze-${{ github.run_id }}
          restore-keys: redt-data-

      - name: 복원 확인
        run: |
          if [ ! -f data/processed/redt.duckdb ]; then
            echo "::error::복원된 DB 가 없습니다. 먼저 collect 를 한 번 돌리세요."
            exit 1
          fi
          python -m redt.cli status

      - name: 교통량 적재
        run: python -m redt.cli load-traffic

      # 패널이 얇을 때 원인이 명단인지 좌표인지 거래인지 가른다.
      # 뭉뚱그리면 엉뚱한 곳을 고치게 된다.
      - name: 영업소 누락 진단
        run: python -m redt.cli gaps

      # 영업소 마스터(도로공사 API)에는 민자고속도로가 없다. 교통량 파일에는
      # 있으므로 이름으로 좌표를 찾아 채운다 (docs/tollgate-coverage.md).
      - name: 영업소 보충 (민자 등)
        if: inputs.fill_tollgates
        run: python -m redt.cli fill-tollgates

      # 새 영업소가 생겼으니 반경 안의 거래를 다시 이어 붙여야 한다.
      # 이 단계를 빠뜨리면 지도에는 뜨는데 거래가 0 으로 보인다.
      - name: 거래 ↔ 영업소 재연결
        if: inputs.fill_tollgates
        run: python -m redt.cli link

      - name: 보충 후 진단
        if: inputs.fill_tollgates
        run: python -m redt.cli gaps

      # 공시지가는 시계열 원천이 없어 차트에 빈칸으로 둔다. 남은 후보가
      # 하나뿐이라(odcloud 15029071) 되는지 확인하고 넘어간다.
      - name: 공시지가 원천 확인
        if: inputs.probe_landprice
        continue-on-error: true
        run: python scripts/odcloud_landprice.py

      # 가설3 — 산단·인구·택지가 IC 효과의 교란이다. 통제를 넣으려면 먼저
      # 무엇이 실제로 오는지 봐야 한다.
      - name: 가설3 원천 확인
        if: inputs.probe_h3
        continue-on-error: true
        run: python scripts/probe_h3.py

      - name: 분석 패널
        run: python -m redt.cli panel

      - name: 밴드별 탄력성
        run: python -m redt.cli analyze --volume "${{ inputs.volume }}"

      # 화물 교통량은 공장·물류 수요를 더 직접 반영한다. 둘을 나란히 봐야
      # '사람이 늘어난 것' 과 '물동량이 늘어난 것' 을 구분할 수 있다.
      - name: 밴드별 탄력성 (화물)
        if: inputs.volume == 'total'
        run: python -m redt.cli analyze --volume freight

      # 지시2 — 개통 전후 비교. 셋 중 인과에 가장 가까운 설계라 매번 같이 본다.
      - name: 신규 개통 전후 지가 (이중차분)
        continue-on-error: true
        run: python -m redt.cli events

      # 지시3 — 같은 지역 안이 아니라 IC 끼리 한 줄로 세워 비교한다.
      - name: IC 교통량 순위 대비 주변 지가
        continue-on-error: true
        run: |
          python -m redt.cli rank --volume total
          python -m redt.cli rank --volume freight

      - name: 스코어 산출
        if: inputs.fill_tollgates || inputs.commit
        continue-on-error: true
        run: python -m redt.cli score

      - name: 화면용 JSON 생성
        if: inputs.fill_tollgates || inputs.commit
        run: python -m redt.cli export-web

      - name: 수집분 보관
        if: always() && inputs.fill_tollgates
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed
            data/interim
          key: redt-data-${{ github.run_id }}

      - name: 결과 커밋
        if: inputs.commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/data
          if git diff --cached --quiet; then
            echo "바뀐 화면 데이터가 없습니다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: 분석 재실행 후 화면 데이터 갱신 (run ${{ github.run_number }})"
          # 실행한 브랜치로 되돌려 놓는다. main 으로 고정하면 브랜치에서
          # 돌렸을 때 그 브랜치의 코드 변경까지 통째로 main 에 올라간다.
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "$BRANCH" \
              && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((2 ** i))
          done
          echo "푸시 실패"; exit 1

      # 커밋을 안 했거나 막혔어도 결과는 손에 쥘 수 있게 올려 둔다.
      - name: 화면용 JSON 올리기
        if: always() && (inputs.fill_tollgates || inputs.commit)
        uses: actions/upload-artifact@v4
        with:
          name: web-data-${{ github.run_number }}
          path: public/app/data

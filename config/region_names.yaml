# 실거래 응답에 **시군구 이름이 안 오는** 코드.
#
# 우리 시군구 이름은 전부 실거래(RTMS) 응답의 sggNm 에서 온다
# (cli.py cmd_region_names — "어디서 베껴 온 표가 아니라 실제로 우리가
# 받은 이름이다"). 그런데 세종특별자치시는 **시도 아래에 시군구가 없는
# 단층제**라 그 칸이 빈 채로 온다. 그래서 지도에 이름 대신 코드가
# 찍혔다 — 보고된 문제(2026-09-09): "36110 이라는 표지판은 세종시로
# 변경해 주세요."
#
# 이 파일이 하는 일은 **빈 자리를 채우는 것뿐**이다. 자료에 이름이 있으면
# 그 이름이 이긴다 — 덮어쓰지 않는다. 좌표·인구·거래는 전부 원래 자료
# 그대로다.
#
# 이름의 근거: 행정표준코드관리시스템 법정동코드 36110 = 세종특별자치시.
# KOSIS 인구표(config/region_history.yaml 의 '36110' 항목이 잇는 그 표)도
# 같은 코드를 세종특별자치시로 준다.
#
# 여기 적힌 코드가 정작 안 쓰이면 내보내기가 그렇게 말한다. 자료에 이름이
# 생겼다는 뜻이니 그때는 이 줄을 지우면 된다.
'36110':
  # 지도 태그에 적히는 이름. "세종시" 로 정했다 — 옆에 붙는
  # 구 이름들(유성구·대덕구)과 길이가 비슷해야 태그가 안 튄다.
  name: 세종시
  # 시·도 축척에서 묶는 이름. 이쪽은 정식 명칭을 쓴다 — '대전광역시',
  # '경기도' 와 나란히 놓이는 자리다.
  sido: 세종특별자치시

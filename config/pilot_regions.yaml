      "41800": 연천군
      "41820": 가평군
      "41830": 양평군

  incheon:
    name: 인천광역시
    why: |
      경기와 맞닿아 있고 항만 물류가 있어 화물 교통량 축과 직접 이어집니다.
    sigungu:
      "28110": 중구
      "28140": 동구
      "28177": 미추홀구
      "28185": 연수구
      "28200": 남동구
      "28237": 부평구
      "28245": 계양구
      "28260": 서구
      "28710": 강화군
      "28720": 옹진군

  chungcheong:
    name: 충청권 (충북·충남·대전·세종)
    why: |
      수도권 규제를 피해 공장이 이전하는 축입니다. 계획관리·생산관리 지역이
      넓게 분포해 이번 용도지역 필터와 잘 맞고, 수도권과 떨어져 있어
      '수도권 프리미엄'과 'IC 효과'를 가르는 대조군 역할도 합니다.
    sigungu:

# 파일럿 권역 정의
#
# ⚠️ 시군구 코드(법정동코드 5자리)는 행안부 자료 기준으로 작성했습니다.
#    수집 전 `python -m redt.cli regions --verify` 로 실제 API 응답을 확인하세요
#    (코드가 틀리면 RTMS는 오류가 아니라 '0건'을 조용히 반환합니다).
#
# 용인시처럼 구가 있는 시는 구 단위 5자리를 씁니다.

regions:
  gyeonggi_south:
    name: 경기 남부 물류·공장 벨트
    why: |
      경부·서해안·평택제천·영동 고속도로가 교차하고, 평택항·삼성 평택캠퍼스로
      화물 물동량이 급증한 구간. 토지·공장 거래가 많아 셀당 최소 거래건수를
      채우기 쉽고, 교통량 변화폭도 커서 β 추정에 유리합니다.
    sigungu:
      "41220": 평택시
      "41590": 화성시
      "41550": 안성시
      "41500": 이천시
      "41370": 오산시
      "41461": 용인시 처인구
      "41670": 여주시
      "41610": 광주시

  chungnam_north:
    name: 충남·충북 북부 산업 벨트
    why: |
      수도권 규제를 피해 공장이 이전하는 축. 산업단지 지정이 활발해
      H5(이벤트 스터디) 표본이 풍부합니다. 대조군 성격도 있어
      '수도권 프리미엄'과 '교통량 효과'를 분리하는 데 유용합니다.
    sigungu:
      "44200": 아산시
      "44130": 천안시            # 구 단위 필요 시 44131/44133 로 분리
      "44270": 당진시
      "44210": 서산시
      "43750": 진천군
      "43770": 음성군
      "43110": 청주시            # 구 단위 필요 시 43111~43114

  gyeonggi_all:
    name: 경기도 전역
    why: |
      경기 남부 8개 시군구만으로는 밴드당 영업소가 19~33개에 그쳐 어느 계수도
      유의하지 않았습니다(docs/results.md). 영업소는 401개를 아는데 거래가
      8개 시군구 것뿐이라 짝이 안 붙는 것이 원인입니다.
    sigungu:
      "41110": 수원시
      "41130": 성남시
      "41150": 의정부시
      "41170": 안양시
      "41190": 부천시
      "41210": 광명시
      "41220": 평택시
      "41250": 동두천시
      "41270": 안산시
      "41280": 고양시
      "41290": 과천시
      "41310": 구리시
      "41360": 남양주시
      "41370": 오산시
      "41390": 시흥시
      "41410": 군포시
      "41430": 의왕시
      "41450": 하남시
      "41460": 용인시
      "41480": 파주시
      "41500": 이천시
      "41550": 안성시
      "41570": 김포시
      "41590": 화성시
      "41610": 광주시
      "41630": 양주시
      "41650": 포천시

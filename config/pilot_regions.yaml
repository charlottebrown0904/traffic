# 기본 파일럿 (여러 권역 동시 지정 가능)
#
# ⚠️ 아래 시군구 코드는 아직 실호출로 검증하지 않았습니다.
#    RTMS 는 잘못된 코드에 오류가 아니라 '0건' 을 조용히 돌려줍니다.
#    `python -m redt.cli regions --verify` 로 확인한 뒤 쓰세요.
active: [gyeonggi_all, incheon, chungcheong]

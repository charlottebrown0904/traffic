# 행정구역 개편 이력 — 바깥 자료의 옛 코드를 우리 코드에 잇는다.
#
# 왜 필요한가
#   KOSIS 인구는 2003~2025 를 주는데, 그 사이에 시군구가 여러 번 바뀌었다.
#   코드를 그대로 맞추면 창원시는 2010년부터, 세종시는 2012년부터만 인구가
#   있고 그 앞은 통째로 빈다. 변화율을 만들 수 없으니 통제로 못 쓴다.
#
# 무엇을 근거로 적었나
#   **관측이다.** data/raw/region_population.csv 에서 어느 코드가 몇 년에
#   나타나고 사라졌는지 세어서, 사라진 코드와 나타난 코드를 이름으로
#   맞췄다. 기억으로 적으면 틀린 대응표를 만들어놓고도 맞는 줄 안다.
#
# 지키는 규칙
#   합병(여럿 → 하나)  과거 값을 **합산**해 잇는다. 근거가 명확하다.
#   개명·이전(1:1)     그대로 잇는다.
#   분할(하나 → 여럿)  **잇지 않는다.** 하나를 여럿으로 나눌 근거가 없다.
#                      비율로 쪼개면 변화율이 거짓이 되고, 그 거짓이
#                      회귀에서는 계수 크기로만 나타나 눈에 안 띈다.
#                      그래서 그 해는 비우고, 몇 개가 비었는지 보고한다.

# 우리 코드 ← 그 이전에 쓰이던 코드(들). 여러 개면 합산한다.
predecessors:
  '48120': ['48110', '48160', '48190']   # 2010 창원·마산·진해 통합
  '50110': ['50910']                     # 2006 북제주군 → 제주시 흡수
  '50130': ['50920']                     # 2006 남제주군 → 서귀포시 흡수
  '43110': ['43110', '43710']            # 2014 청주시 + 청원군 통합
  '41670': ['41730']                     # 2013 여주군 → 여주시
  '44270': ['44830']                     # 2012 당진군 → 당진시
  '28177': ['28170']                     # 2018 인천 남구 → 미추홀구
  '27720': ['47720']                     # 2023 군위군 경북 → 대구 편입
  '41190': ['41195', '41197', '41199']   # 2016 부천 원미·소사·오정구 폐지
  # 세종시는 연기군 전역에 공주·청원 일부가 더해진 것이라 1:1 이 아니다.
  # 연기군만으로 이으면 2012년에 인구가 뛴 것처럼 보인다. 그래도 비우는
  # 것보다 낫다고 보고 잇되, 근사라는 사실을 여기 적어 둔다.
  '36110': ['44730']                     # 2012 연기군 → 세종특별자치시 (근사)

# 시도가 통째로 바뀐 경우. 코드가 완전히 새로 나서 자릿수 대응이 없다.
# 이름으로 잇는다 — 옛 접두사 안에서 이름이 겹치지 않는 것을 확인했다.
sido_moves:
  - to_prefix: '12'
    from_prefixes: ['29', '46']
    note: 광주광역시·전라남도 통합 (docs/results-run13.md)

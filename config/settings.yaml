# 분석 파라미터 — 여기만 바꾸면 전 파이프라인에 반영됩니다.

period:
  # 실거래 신고 의무가 2006-01 에 시작됐다. 그 이전 거래는 국가가 갖고 있지 않다.
  # 교통량은 1년 앞서 보므로 실제로 쓰이는 교통량은 2005년부터다.
  start_year: 2006
  end_year: 2025

trade_kinds: [land, factory, house]   # commercial 은 선택

# 공장·창고가 실제로 들어서는 용도지역만 본다 (비어 있으면 전부).
#
# 상업지역 땅과 관리지역 땅을 한 헤도닉 지수에 섞으면, 가격 변동의 상당
# 부분이 '어떤 용도지역이 많이 거래됐나' 로 설명돼 버린다. 우리가 보려는
# 것은 같은 성격의 땅끼리의 시세 변화다.
#
# 표본은 줄어든다. 대신 남는 표본이 서로 비교 가능해진다.
# 값은 부분일치로 본다 — API 가 '계획관리' 로도 '계획관리지역' 으로도 준다.
land_use_filter:
  - 계획관리      # 비도시지역. 공장·창고 입지의 주 대상
  - 생산관리      # 비도시지역
  - 자연녹지      # 도시지역이지만 공장·창고가 들어간다

spatial:
  # 거리 밴드 (km).
  #
  #   0-1 · 1-3 · 3-5   영향범위. IC 효과가 있다면 여기서 나와야 한다.
  #   5-10              위약(대조) 밴드. 여기서도 같은 계수가 나오면
  #                     그건 IC 효과가 아니라 지역 효과라는 뜻이다.
  #
  # 영향범위 최대를 5km 로 못박았다(2026-09-02 지시). 예전에는 10-20km 를
  # 대조로 썼는데, 한 밴드에서만 연결이 311만 쌍 나와 전체 419만 쌍의 74%를
  # 차지했다. 중복이 심하고 무겁다.
  #
  # 대조 밴드를 아예 없애지는 않았다. 없애면 앞으로 나오는 계수를 영원히
  # 'IC 효과' 라고 부를 수 없다 — 멀리서도 같은 값이 나오는지 볼 방법이
  # 사라지기 때문이다. 5-10km 하나만 남겨 그 역할을 시킨다.
  bands:
    # 0-1 과 1-3 을 나눈 이유는 docs/literature.md 1번에 있다. 선행연구에서
    # IC 인접은 오히려 가격이 낮고 2~4km 가 정점이었다. 하나로 묶으면 감점
    # 구간과 프리미엄 구간이 상쇄돼 계수가 0 으로 나오고, 우리는 그걸
    # '효과 없음' 으로 잘못 읽게 된다.
    - [0, 1]
    - [1, 3]
    - [3, 5]
    - [5, 10]
  # 스코어·화면의 기본 밴드. bands 에 없는 값이면 실행이 멈춘다 —
  # 조용히 빈 결과를 내는 것보다 낫다.
  primary_band: "1-3"
  # 가장 먼 밴드의 바깥 경계와 같게 둔다. 이보다 크면 어느 밴드에도 안 들어가는
  # 연결을 만들어 저장만 하고 버리게 된다.
  max_link_km: 10
  # 법정동 중심점 좌표(오차 ±1~2km)로는 근거리 밴드를 신뢰할 수 없다.
  # 아래 밴드는 지번단위(parcel) 좌표를 가진 거래만 사용한다.
  require_parcel_bands: ["0-1", "1-3", "3-5"]

panel:
  min_trades_per_cell: 5      # 셀당 최소 거래건수 (미만이면 결측)
  winsorize_pct: 0.01         # 단가 상하위 1% 윈저화
  exclude_cancelled: true     # 해제된 계약(cdealType='O') 제외
  exclude_direct_deals: false # 직거래 제외 여부 (특수관계 거래 우려 시 true)
  traffic_lag_years: 1        # 교통량 시차
  # 헤도닉 회귀에 쓸 최대 표본. 예측은 전수에 하고, 적합만 이만큼으로 자릅니다.
  #
  # 이 회귀는 시군구·연도·지목을 더미로 펴므로 열이 300개쯤 됩니다.
  # 600만 행이면 행렬만 14GB 라 러너(16GB)가 죽습니다 — run 18 이 그렇게
  # 죽었습니다. 계수는 30만 건이면 충분히 정밀합니다.
  hedonic_fit_max: 300000

# 지오코딩 호출 방식.
#
# run 21 이 지오코딩에만 2시간 58분을 썼다. 3만 건을 한 줄로 세워
# 한 건씩 부른 결과다. 브이월드의 제약은 하루 호출 수(3만~4만)지 초당
# 속도가 아니므로, 어차피 다 쓰고 멈출 하루치를 3시간에 걸쳐 쓸 이유가
# 없다.
#
#   workers        동시에 부를 개수
#   calls_per_sec  워커를 합친 전체 속도 상한. 워커 수로만 정하면 응답이
#                  빨라지는 날 우리가 통제 못 하는 속도가 나온다.
#
# 8 × 12건/초 → 3만 건에 42분.
geocode:
  workers: 8
  calls_per_sec: 12

# 필지 특성(도로접·형상·지세) — 브이월드 토지특성 WFS.
#
# 실측(2026-09-07 남이천·안성 반경 3km)에서 나온 값이다.
#   남이천  칸 42개 · 필지 15,083 · 쪼갠 칸 0회 · 밀도 533개/km²
#   안성    칸 42개 · 필지 27,132 · 쪼갠 칸 7회 · 밀도 960개/km²
#
# tile_deg 를 키우면 호출은 줄지만 한도(1,000개)에 더 자주 닿아 쪼개진다.
# 0.01도(약 1km²)에서 성긴 곳은 안 쪼개지고 빽빽한 곳만 쪼개졌다 —
# 그 정도가 맞다.
landchar:
  tile_deg: 0.01
  workers: 6
  calls_per_sec: 8

# 교통량 소스 우선순위. 영업소별로 앞선 소스가 있으면 그것만 쓴다.
#   tcs  : 영업소 진출입 교통량 — 지역 수요를 직접 반영 (선호)
#   aadt : 본선 지점 연평균일교통량 — 통과 교통 포함, 대신 장기 시계열
traffic_source_priority: [tcs, aadt]

vehicle_groups:
  passenger: [1, 6]
  freight: [3, 4, 5]
  mid: [2]

# 파일럿 지역 (빈 리스트면 전국). 시도 2자리 코드.
pilot_sido: []

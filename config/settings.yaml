# 분석 파라미터 — 여기만 바꾸면 전 파이프라인에 반영됩니다.

period:
  # 실거래 신고 의무가 2006-01 에 시작됐다. 그 이전 거래는 국가가 갖고 있지 않다.
  # 교통량은 1년 앞서 보므로 실제로 쓰이는 교통량은 2005년부터다.
  start_year: 2006
  end_year: 2025

trade_kinds: [land, factory, house]   # commercial 은 선택

spatial:
  bands:                  # 거리 밴드 (km). 마지막 밴드는 위약 검정용 대조군.
    # 0-1 과 1-3 을 나눈 이유는 docs/literature.md 1번에 있다. 선행연구에서
    # IC 인접은 오히려 가격이 낮고 2~4km 가 정점이었다. 하나로 묶으면 감점
    # 구간과 프리미엄 구간이 상쇄돼 계수가 0 으로 나오고, 우리는 그걸
    # '효과 없음' 으로 잘못 읽게 된다.
    - [0, 1]
    - [1, 3]
    - [3, 5]
    - [5, 10]
    - [10, 20]
  # 스코어·화면의 기본 밴드. bands 에 없는 값이면 실행이 멈춘다 —
  # 조용히 빈 결과를 내는 것보다 낫다.
  primary_band: "1-3"
  max_link_km: 20
  # 법정동 중심점 좌표(오차 ±1~2km)로는 근거리 밴드를 신뢰할 수 없다.
  # 아래 밴드는 지번단위(parcel) 좌표를 가진 거래만 사용한다.
  require_parcel_bands: ["0-1", "1-3", "3-5"]

panel:
  min_trades_per_cell: 5      # 셀당 최소 거래건수 (미만이면 결측)
  winsorize_pct: 0.01         # 단가 상하위 1% 윈저화
  exclude_cancelled: true     # 해제된 계약(cdealType='O') 제외
  exclude_direct_deals: false # 직거래 제외 여부 (특수관계 거래 우려 시 true)
  traffic_lag_years: 1        # 교통량 시차

# 교통량 소스 우선순위. 영업소별로 앞선 소스가 있으면 그것만 쓴다.
#   tcs  : 영업소 진출입 교통량 — 지역 수요를 직접 반영 (선호)
#   aadt : 본선 지점 연평균일교통량 — 통과 교통 포함, 대신 장기 시계열
traffic_source_priority: [tcs, aadt]

vehicle_groups:
  passenger: [1, 6]
  freight: [3, 4, 5]
  mid: [2]

# 파일럿 지역 (빈 리스트면 전국). 시도 2자리 코드.
pilot_sido: []

# ⚠️ 지금은 **쓰이지 않습니다.** (2026-09-09)
#
# Cloudflare Pages 로 옮겨 실측했더니 브이월드(api.vworld.kr)가
# 502 로 거부했습니다 — 한국에서 열어도 마찬가지였습니다. Cloudflare
# Workers 에는 리전 고정이 없고, 브이월드는 지오코딩·타일·필지조회
# 셋에 다 쓰입니다. 그래서 Vercel(regions: icn1) 에 남았습니다.
#
# 지우지 않고 둡니다 — 다른 길이 생기면 하루 안에 다시 갑니다.
# 실측표와 사정: docs/cloudflare-migration.md

# Cloudflare Pages 설정.
#
# 이 파일은 **Vercel 과 무관하다.** Vercel 은 vercel.json 을 보고,
# 이것을 무시한다. 둘을 나란히 띄워 두는 동안 서로 건드리지 않는다.
# **Pages 프로젝트 이름과 글자까지 같아야 한다.** 다르면 빌드가
# "name in wrangler.toml does not match the Pages project" 로 죽는다.
# 대시보드에서 이름을 바꾸면 여기도 바꿔야 한다.
name = "toji-gogo"
pages_build_output_dir = "public"

# nodejs_compat 이 있어야 process.env 와 Buffer 가 산다. 우리 함수 둘이
# 그 둘을 쓴다 (api/relay.js 의 node:crypto, api/tile.js 의 Buffer).
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

# 비밀이 아닌 값은 **여기**에 둔다.
#
# wrangler.toml 이 있으면 Cloudflare 대시보드는 Secret(암호화 변수)만
# 받습니다. 나머지는 이 파일이 맡습니다 — 그래서 비밀도 아닌 값을
# 대시보드에 넣을 이유가 없고, 여기 두면 코드와 함께 버전이 남습니다.
#
# 인증키 다섯(DATA_GO_KR_KEY · VWORLD_KEY · RELAY_TOKEN · KOSIS_KEY ·
# EX_API_KEY)은 **절대 여기 적지 않습니다.** 공개 저장소입니다.
# 그것들은 대시보드에 Secret 으로 넣습니다.
#
# Referer 는 **어느 주소가 서빙하든 이 값**으로 나갑니다. 브이월드
# 콘솔에 toji.fyi 가 등록돼 있으면 pages.dev 로 접속해도 통과합니다.
[vars]
VWORLD_REFERER = "https://toji.fyi/"
